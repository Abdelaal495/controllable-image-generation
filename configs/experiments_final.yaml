          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 10, lr: 0.1, mu: 0.0, beta: 0.25, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.2948 at 8 images

  random_inpainting:
    enabled: true
    problem: random_inpaint
    num_images: 100
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      jit:
        methods:
          sdedit:      {t0: 0.8, steps: 25, solver: heun}   # LPIPS 0.7014 at 8 images
