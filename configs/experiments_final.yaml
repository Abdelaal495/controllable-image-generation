# =====================================================================================
# FINAL BENCHMARK -- 100 classes, one image each, every cell at its tuned setting
# =====================================================================================
#
#   python build_local_imagenet_pool.py --num-classes 100 --seed 0   # once
#   python run.py --config configs/experiments_final.yaml --dry-run
#   python run.py --config configs/experiments_final.yaml --run-id final
#
# 6 problems x 4 models x 6 strategies = 144 atomic jobs, 100 images each.  Unlike every
# earlier file this one sweeps NOTHING: each entry is the single configuration that won
# its cell in the tuning study, so the run measures the methods rather than searching for
# them.  Provenance for every number is docs/best_hyperparameters.md; the sweeps that
# produced them are experiments_sit_imf_hpo_v2/_v3, _sit_imf_tasks, _jit_pmf_tasks,
# _lambda_pixel_control, _round4 and _round5.  The `# LPIPS ... at 8 images` comment on
# each line is what that setting scored during tuning, for comparison after the fact.
#
# THE POOL IS NOT OPTIONAL.  src.data.IMAGENET_EXAMPLES holds 32 curated classes and
# `data.source: hf_imagenet_val` raises above that, so 100 images can only come from a
# local folder.  Build it with the command above.  Its first 32 classes are the curated
# list in its original order, so image ids -- and therefore the generative noise drawn for
# them -- match the earlier 8-image runs exactly; the remaining 68 are drawn from the other
# 968 classes with the builder's own `--seed`.  That seed is a property of the DATASET.
# `runtime.seed` below is a different thing entirely: it fixes generative noise, measurement
# noise, masks and stroke geometry, and never influences which images are used.
#
# COST.  Measured per-image times from the tuning runs give roughly 6,100 s per image for
# all four models and all six problems, i.e. about 170 hours at 100 images, of which iMF is
# 78%.  iMF at batch_size 8 (validated in round 5, no OOM) brings that to roughly 100
# hours.  Consider --shard K/N across several GPUs, or --models to split the run, before
# starting it on one card.
#
# FIGURES.  Comparison grids paginate at 4 images per page, so 100 images produce ~25 pages
# per (problem, model) -- about 600 large PNGs.  Pass --no-figures for the measurement run
# and regenerate a subset afterwards with --aggregate if the pictures are wanted.
#
# TWO CAVEATS carried over from tuning, both in docs/best_hyperparameters.md:
#   * 92 of the 120 tuned settings had at least one rival that a paired per-image test
#     could not separate from them at 8 images, and 114 sat at the edge of their swept
#     range.  These are good settings, not proven optima.
#   * On the inpainting problems full-image LPIPS and PSNR are dominated by the pixels the
#     measurement already supplies; read missing_psnr alongside them.
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: true
  verbose: true
  max_atomic_jobs: 200
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02

data:
  # Built by build_local_imagenet_pool.py --num-classes 100 --seed 0
  source: local_folder
  local_folder: "cache/data/imagenet_val_100"
  image_size: 256

# batch_size is 2 everywhere.  Raising iMF to 8 looked safe on the GPU -- its device peak
# is only 1.3 GiB at batch 2 -- but the binding constraint for the JAX models is HOST
# memory, which was never measured: at 100 images and batch 8 the process sawtooths between
# 33 and 55 GiB on a 62 GiB machine and gets killed by the OOM killer partway through the
# first job.  At batch 2 the same job stays between 19 and 24 GiB.  Device peak is not a
# safe proxy for host peak here; measure `ps -o rss` before raising this.
models:
  jit:
    variant: JiT-B/16
    batch_size: 2
  pmf:
    batch_size: 2
  sit:
    batch_size: 2
  imf:
    batch_size: 2
    vae_decode_batch: 2

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: true

metrics:
  lpips: true
  lpips_net: alex

experiments:

  denoising:
    enabled: true
    problem: denoising
    num_images: 100
    degradation: {sigma: 0.20}
    models:
      jit:
        methods:
          sdedit:      {t0: 0.8, steps: 25, solver: heun}   # LPIPS 0.4152 at 8 images
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: 3, lam: 5.0, n_ctrl: 20, lr: 0.05}   # LPIPS 0.1136 at 8 images
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4, lam: 30.0, n_ctrl: 80, lr: 0.1}   # LPIPS 0.1749 at 8 images
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 0.5, phi_normalization: half_sum_squared}   # LPIPS 0.1050 at 8 images
          dflow:       {t0: 0.8, steps: 2, solver: heun, num_opt_steps: 80, lr: 0.05, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.2272 at 8 images
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.05, mu: 2.0, beta: 0.5, solver: heun, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.1028 at 8 images
      sit:
        methods:
          sdedit:      {t0: 0.8, steps: 4, solver: heun}   # LPIPS 0.6717 at 8 images
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: 1, lam: 500.0, n_ctrl: 40, lr: 0.1}   # LPIPS 0.2844 at 8 images
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4, lam: 300.0, n_ctrl: 80, lr: 0.1}   # LPIPS 0.2335 at 8 images
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 0.5, alpha: 0.5, phi_normalization: half_sum_squared}   # LPIPS 0.5979 at 8 images
          dflow:       {t0: 0.8, steps: 2, solver: heun, num_opt_steps: 40, lr: 0.1, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.6171 at 8 images
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.05, mu: 0.0, beta: 0.25, solver: heun, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.2239 at 8 images
      pmf:
        methods:
          sdedit:      {t0: 0.8, steps: 2}   # LPIPS 0.3890 at 8 images
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: 2, lam: 15.0, n_ctrl: 20, lr: 0.1}   # LPIPS 0.1068 at 8 images
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2, lam: 5.0, n_ctrl: 40, lr: 0.1}   # LPIPS 0.2501 at 8 images
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 0.5, phi_normalization: half_sum_squared}   # LPIPS 0.1050 at 8 images
          dflow:       {t0: 0.8, steps: 2, num_opt_steps: 80, lr: 0.05, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.2695 at 8 images
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 20, lr: 0.05, mu: 2.0, beta: 0.5, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.0988 at 8 images
      imf:
        methods:
          sdedit:      {t0: 0.8, steps: 4}   # LPIPS 0.6387 at 8 images
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: 1, lam: 50.0, n_ctrl: 20, lr: 0.1}   # LPIPS 0.4261 at 8 images
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2, lam: 1000.0, n_ctrl: 20, lr: 0.1}   # LPIPS 0.4593 at 8 images
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 0.5, alpha: 1.0, phi_normalization: half_sum_squared}   # LPIPS 0.5175 at 8 images
          dflow:       {t0: 0.8, steps: 2, num_opt_steps: 80, lr: 0.2, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.5539 at 8 images
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 10, lr: 0.1, mu: 0.0, beta: 0.5, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.3320 at 8 images

  deblurring:
    enabled: true
    problem: deblur
    num_images: 100
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      jit:
        methods:
          sdedit:      {t0: 0.8, steps: 25, solver: heun}   # LPIPS 0.4268 at 8 images
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: 1, lam: 50.0, n_ctrl: 20, lr: 0.1}   # LPIPS 0.1568 at 8 images
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4, lam: 300.0, n_ctrl: 80, lr: 0.1}   # LPIPS 0.1643 at 8 images
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 0.5, phi_normalization: half_sum_squared}   # LPIPS 0.3700 at 8 images
          dflow:       {t0: 0.8, steps: 2, solver: heun, num_opt_steps: 80, lr: 0.1, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.2839 at 8 images
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.05, mu: 0.2, beta: 0.5, solver: heun, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.1468 at 8 images
      sit:
        methods:
          sdedit:      {t0: 0.8, steps: 4, solver: heun}   # LPIPS 0.6082 at 8 images
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: 1, lam: 50.0, n_ctrl: 40, lr: 0.1}   # LPIPS 0.2744 at 8 images
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4, lam: 300.0, n_ctrl: 40, lr: 0.1}   # LPIPS 0.2492 at 8 images
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 0.5, alpha: 0.5, phi_normalization: half_sum_squared}   # LPIPS 0.6186 at 8 images
          dflow:       {t0: 0.8, steps: 2, solver: heun, num_opt_steps: 80, lr: 0.05, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.5297 at 8 images
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.05, mu: 0.0, beta: 0.25, solver: heun, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.2189 at 8 images
      pmf:
        methods:
          sdedit:      {t0: 0.8, steps: 2}   # LPIPS 0.3944 at 8 images
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: 1, lam: 50.0, n_ctrl: 20, lr: 0.1}   # LPIPS 0.1791 at 8 images
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2, lam: 100.0, n_ctrl: 80, lr: 0.1}   # LPIPS 0.1818 at 8 images
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 0.5, phi_normalization: half_sum_squared}   # LPIPS 0.2613 at 8 images
          dflow:       {t0: 0.8, steps: 2, num_opt_steps: 80, lr: 0.05, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.2518 at 8 images
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 20, lr: 0.05, mu: 0.05, beta: 0.5, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.2305 at 8 images
      imf:
        methods:
          sdedit:      {t0: 0.8, steps: 2}   # LPIPS 0.5963 at 8 images
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: 1, lam: 50.0, n_ctrl: 20, lr: 0.1}   # LPIPS 0.3775 at 8 images
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2, lam: 1000.0, n_ctrl: 20, lr: 0.1}   # LPIPS 0.3795 at 8 images
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 0.25, alpha: 1.0, phi_normalization: half_sum_squared}   # LPIPS 0.5345 at 8 images
          dflow:       {t0: 0.8, steps: 2, num_opt_steps: 40, lr: 0.1, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.5938 at 8 images
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 10, lr: 0.1, mu: 0.0, beta: 0.25, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.3547 at 8 images

  super_resolution:
    enabled: true
    problem: super_resolution
    num_images: 100
    degradation: {sigma: 0.05, factor: 2}
    models:
      jit:
        methods:
          sdedit:      {t0: 0.8, steps: 25, solver: heun}   # LPIPS 0.4153 at 8 images
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: 3, lam: 150.0, n_ctrl: 20, lr: 0.05}   # LPIPS 0.1100 at 8 images
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4, lam: 300.0, n_ctrl: 40, lr: 0.1}   # LPIPS 0.1085 at 8 images
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 0.5, phi_normalization: half_sum_squared}   # LPIPS 0.4312 at 8 images
          dflow:       {t0: 0.8, steps: 2, solver: heun, num_opt_steps: 80, lr: 0.05, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.2517 at 8 images
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.05, mu: 1.0, beta: 0.5, solver: heun, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.1036 at 8 images
      sit:
        methods:
          sdedit:      {t0: 0.8, steps: 4, solver: heun}   # LPIPS 0.6237 at 8 images
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: 1, lam: 500.0, n_ctrl: 40, lr: 0.1}   # LPIPS 0.2558 at 8 images
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4, lam: 300.0, n_ctrl: 40, lr: 0.1}   # LPIPS 0.2739 at 8 images
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 0.25, alpha: 0.5, phi_normalization: half_sum_squared}   # LPIPS 0.6081 at 8 images
          dflow:       {t0: 0.8, steps: 2, solver: heun, num_opt_steps: 80, lr: 0.05, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.5433 at 8 images
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.1, mu: 0.0, beta: 0.25, solver: heun, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.1889 at 8 images
      pmf:
        methods:
          sdedit:      {t0: 0.8, steps: 2}   # LPIPS 0.3884 at 8 images
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: 2, lam: 50.0, n_ctrl: 20, lr: 0.1}   # LPIPS 0.2337 at 8 images
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2, lam: 1000.0, n_ctrl: 80, lr: 0.1}   # LPIPS 0.1153 at 8 images
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 0.5, phi_normalization: half_sum_squared}   # LPIPS 0.2987 at 8 images
          dflow:       {t0: 0.8, steps: 2, num_opt_steps: 80, lr: 0.05, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.2446 at 8 images
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 20, lr: 0.05, mu: 0.5, beta: 0.5, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.1167 at 8 images
      imf:
        methods:
          sdedit:      {t0: 0.8, steps: 2}   # LPIPS 0.5758 at 8 images
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: 1, lam: 50.0, n_ctrl: 20, lr: 0.1}   # LPIPS 0.3505 at 8 images
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2, lam: 1000.0, n_ctrl: 20, lr: 0.1}   # LPIPS 0.3630 at 8 images
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 0.5, alpha: 1.0, phi_normalization: half_sum_squared}   # LPIPS 0.5406 at 8 images
          dflow:       {t0: 0.8, steps: 2, num_opt_steps: 40, lr: 0.1, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.6145 at 8 images
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 10, lr: 0.1, mu: 0.0, beta: 0.25, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.3194 at 8 images

  box_inpainting:
    enabled: true
    problem: box_inpaint
    num_images: 100
    degradation: {sigma: 0.05, box: 40}
    models:
      jit:
        methods:
          sdedit:      {t0: 0.8, steps: 4, solver: heun}   # LPIPS 0.4181 at 8 images
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: 3, lam: 50.0, n_ctrl: 20, lr: 0.05}   # LPIPS 0.0620 at 8 images
