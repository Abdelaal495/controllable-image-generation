          dflow:       {t0: 0.8, steps: 2, solver: heun, num_opt_steps: 80, lr: 0.05, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.2910 at 8 images
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.05, mu: 0.5, beta: 0.5, solver: heun, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.1003 at 8 images
      sit:
        methods:
          sdedit:      {t0: 0.8, steps: 4, solver: heun}   # LPIPS 0.7483 at 8 images
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: 1, lam: 500.0, n_ctrl: 40, lr: 0.1}   # LPIPS 0.3561 at 8 images
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4, lam: 300.0, n_ctrl: 40, lr: 0.1}   # LPIPS 0.3635 at 8 images
