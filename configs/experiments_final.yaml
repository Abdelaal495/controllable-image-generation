          dflow:       {t0: 0.8, steps: 2, solver: heun, num_opt_steps: 80, lr: 0.05, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.2502 at 8 images
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.05, mu: 0.2, beta: 0.5, solver: heun, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.0364 at 8 images
      sit:
        methods:
          sdedit:      {t0: 0.8, steps: 4, solver: heun}   # LPIPS 0.6195 at 8 images
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: 1, lam: 500.0, n_ctrl: 40, lr: 0.1}   # LPIPS 0.2414 at 8 images
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4, lam: 300.0, n_ctrl: 40, lr: 0.1}   # LPIPS 0.2225 at 8 images
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 0.5, alpha: 0.5, phi_normalization: half_sum_squared}   # LPIPS 0.5981 at 8 images
          dflow:       {t0: 0.8, steps: 2, solver: heun, num_opt_steps: 80, lr: 0.05, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.5339 at 8 images
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.05, mu: 0.0, beta: 0.25, solver: heun, phi_normalization: half_mean_squared_per_measurement}   # LPIPS 0.1960 at 8 images
