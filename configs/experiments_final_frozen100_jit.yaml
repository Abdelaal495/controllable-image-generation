# =====================================================================================
# FINAL BENCHMARK at t0 = 1.0 on the paper's frozen ImageNet-100 (class seed 42 / image seed 43),
# model jit only -- one process per GPU.  Generated by scripts/make_final_frozen100_configs.py
# from outputs/stage2_jit: every entry is the lowest-LPIPS Stage-2 configuration of its cell (8 images) RESTRICTED TO THE STAGE-1 GRID (edge extensions excluded), the
# trailing comment is that Stage-2 score.  Layout as configs/experiments_t1_final.yaml
# (__core / __rhc / __rhso split by memory class; batch_size resolves per (experiment, model)).
#
#   python run.py --config configs/experiments_final_frozen100_jit.yaml --dry-run
#   CUDA_VISIBLE_DEVICES=<k> python -u run.py --config configs/experiments_final_frozen100_jit.yaml --run-id final_jit --no-figures
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: true
  verbose: true
  max_atomic_jobs: 200
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02

data:
  # Built by: python build_local_imagenet_pool.py --frozen-manifest benchmarks/imagenet100_c42_i43/manifest.csv
  source: local_folder
  local_folder: "cache/data/imagenet100_c42_i43_mirror"
  image_size: 256

models:
  jit:
    variant: JiT-B/16

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false

metrics:
  lpips: true
  lpips_net: alex

experiments:


  denoising__core:
    enabled: true
    problem: denoising
    num_images: 100
    degradation: {sigma: 0.20}
    models:
      jit:
        batch_size: 20
        methods:
          sdedit:      {t0: 1.0, solver: heun, steps: 25}   # Stage-2 LPIPS 0.7152 PSNR 9.22 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 50, gamma0: 200000.0, alpha: 0.5}   # Stage-2 LPIPS 0.0986 PSNR 28.00 at 8 images
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 640, lr: 0.3}   # Stage-2 LPIPS 0.4802 PSNR 23.38 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 20, lam: 30, lr: 0.3}   # Stage-2 LPIPS 0.1854 PSNR 27.31 at 8 images

  denoising__rhc:
    enabled: true
    problem: denoising
    num_images: 100
    degradation: {sigma: 0.20}
    models:
      jit:
        batch_size: 10
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 2, lam: 15, lr: 0.05}   # Stage-2 LPIPS 0.1144 PSNR 28.29 at 8 images

  denoising__rhso:
    enabled: true
    problem: denoising
    num_images: 100
    degradation: {sigma: 0.20}
    models:
      jit:
        batch_size: 8
        methods:
          rhso:        {t0: 1.0, solver: heun, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.005, mu: 0.2}   # Stage-2 LPIPS 0.1343 PSNR 27.41 at 8 images

  deblurring__core:
    enabled: true
    problem: deblur
    num_images: 100
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      jit:
        batch_size: 20
        methods:
          sdedit:      {t0: 1.0, solver: heun, steps: 25}   # Stage-2 LPIPS 0.7152 PSNR 9.22 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 200, gamma0: 1200000.0, alpha: 0.5}   # Stage-2 LPIPS 0.1720 PSNR 28.28 at 8 images
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 640, lr: 0.3}   # Stage-2 LPIPS 0.5283 PSNR 22.72 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 40, lam: 1000, lr: 0.1}   # Stage-2 LPIPS 0.1445 PSNR 28.68 at 8 images

  deblurring__rhc:
    enabled: true
    problem: deblur
    num_images: 100
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      jit:
        batch_size: 10
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 1, lam: 60, lr: 0.05}   # Stage-2 LPIPS 0.1672 PSNR 28.26 at 8 images

  deblurring__rhso:
    enabled: true
    problem: deblur
    num_images: 100
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      jit:
        batch_size: 8
        methods:
          rhso:        {t0: 1.0, solver: heun, num_rhso_steps: 8, num_opt_steps: 20, lr: 0.01, mu: 0}   # Stage-2 LPIPS 0.0965 PSNR 29.04 at 8 images

  super_resolution__core:
    enabled: true
    problem: super_resolution
    num_images: 100
    degradation: {sigma: 0.05, factor: 2}
    models:
      jit:
        batch_size: 20
        methods:
          sdedit:      {t0: 1.0, solver: heun, steps: 25}   # Stage-2 LPIPS 0.7152 PSNR 9.22 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 20, gamma0: 200000.0, alpha: 0.25}   # Stage-2 LPIPS 0.0937 PSNR 26.24 at 8 images
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 640, lr: 0.3}   # Stage-2 LPIPS 0.4804 PSNR 23.28 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 40, lam: 540, lr: 0.05}   # Stage-2 LPIPS 0.1007 PSNR 26.30 at 8 images

  super_resolution__rhc:
    enabled: true
    problem: super_resolution
    num_images: 100
    degradation: {sigma: 0.05, factor: 2}
    models:
      jit:
        batch_size: 10
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 2, lam: 720, lr: 0.05}   # Stage-2 LPIPS 0.1491 PSNR 26.11 at 8 images

  super_resolution__rhso:
    enabled: true
    problem: super_resolution
    num_images: 100
    degradation: {sigma: 0.05, factor: 2}
    models:
      jit:
        batch_size: 8
        methods:
          rhso:        {t0: 1.0, solver: heun, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.01, mu: 0.2}   # Stage-2 LPIPS 0.1065 PSNR 26.70 at 8 images

  random_inpainting__core:
    enabled: true
    problem: random_inpaint
    num_images: 100
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      jit:
        batch_size: 20
        methods:
          sdedit:      {t0: 1.0, solver: heun, steps: 25}   # Stage-2 LPIPS 0.7152 PSNR 9.22 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 50, gamma0: 100000.0, alpha: 0.1}   # Stage-2 LPIPS 0.0974 PSNR 26.42 at 8 images
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 640, lr: 0.3}   # Stage-2 LPIPS 0.4882 PSNR 23.05 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 20, lam: 1000, lr: 0.05}   # Stage-2 LPIPS 0.0798 PSNR 27.06 at 8 images

  random_inpainting__rhc:
    enabled: true
    problem: random_inpaint
    num_images: 100
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      jit:
        batch_size: 10
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 2, lam: 240, lr: 0.02}   # Stage-2 LPIPS 0.1717 PSNR 25.80 at 8 images

  random_inpainting__rhso:
    enabled: true
    problem: random_inpaint
    num_images: 100
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      jit:
        batch_size: 8
        methods:
          rhso:        {t0: 1.0, solver: heun, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.01, mu: 0}   # Stage-2 LPIPS 0.0919 PSNR 26.99 at 8 images

  box_inpainting__core:
    enabled: true
    problem: box_inpaint
    num_images: 100
    degradation: {sigma: 0.05, box: 40}
    models:
      jit:
        batch_size: 20
        methods:
          sdedit:      {t0: 1.0, solver: heun, steps: 25}   # Stage-2 LPIPS 0.7152 PSNR 9.22 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 50, gamma0: 200000.0, alpha: 0.1}   # Stage-2 LPIPS 0.0441 PSNR 30.61 at 8 images
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 640, lr: 0.3}   # Stage-2 LPIPS 0.4926 PSNR 21.25 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 20, lam: 180, lr: 0.1}   # Stage-2 LPIPS 0.0401 PSNR 30.92 at 8 images

  box_inpainting__rhc:
    enabled: true
    problem: box_inpaint
    num_images: 100
    degradation: {sigma: 0.05, box: 40}
    models:
      jit:
        batch_size: 10
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 1, lam: 30, lr: 0.05}   # Stage-2 LPIPS 0.0635 PSNR 29.14 at 8 images

  box_inpainting__rhso:
    enabled: true
    problem: box_inpaint
    num_images: 100
    degradation: {sigma: 0.05, box: 40}
    models:
      jit:
        batch_size: 8
        methods:
          rhso:        {t0: 1.0, solver: heun, num_rhso_steps: 8, num_opt_steps: 20, lr: 0.01, mu: 0}   # Stage-2 LPIPS 0.0458 PSNR 29.38 at 8 images
