# =====================================================================================
# SDEdit vs. MPC-Flow  --  the only file you normally edit.
# =====================================================================================
#
# The question this repository answers:
#
#   Given the same degraded observation, the same generative model, the same corruption
#   strength t0 and the same sampled generative noise, how much do MPC-RHC and MPC-delta_t
#   improve reconstruction relative to ordinary SDEdit, and what does that cost?
#
# Structure
#   experiments.<name>.degradation      the inverse problem's parameters (built ONCE and
#                                       shared by every model and method below it)
#   experiments.<name>.models.<model>   which model participates
#   ....methods.{sdedit,mpc_rhc,mpc_delta_t,pnp,dflow}
#
# You never write `standard_flow:` or `meanflow:`.  The registry already knows that JiT and
# SiT are standard flows and that pMF and iMF are MeanFlows.
#
# SWEEPS.  These fields accept a scalar or a list; lists expand as a Cartesian product:
#   shared      t0, beta
#   sdedit      steps, solver
#   mpc         num_mpc_steps, lam, n_ctrl, lr, optimizer, warm_start, grad_clip,
#               phi_normalization, control_cost_normalization
#   mpc_rhc     K
#   mpc_delta_t delta_t_lambda_scaling
#   pnp         num_pnp_steps, gamma0, alpha, noise_samples, phi_normalization
#   dflow       steps, solver, num_opt_steps, lr, optimizer, phi_normalization
#   rhso        num_rhso_steps, num_opt_steps, lr, mu, optimizer, phi_normalization,
#               solver (standard-flow models only)
# Any other list (e.g. models.jit.guidance.interval) is a literal value, never a sweep.
#
# TIME DISCRETISATION.  Every method places its times on the shared power-law grid
#
#     s_k = s0 + (1 - s0) * (k / N)^beta
#
# beta < 1 gives more resolution near clean space, beta = 1 IS the legacy uniform schedule
# (bitwise), beta > 1 more resolution near the noisy start.  It defaults to 1.0, so a config
# that never mentions it behaves exactly as before.  Suggested sweep: beta: [0.5, 1.0, 2.0].
# beta is NOT PnP's alpha (which scales gamma_k), and for MPC-RHC it shapes only the outer
# replanning grid, never the internal K-step planning problem.
# See docs/schedule_and_rhso.md.
#
# Unknown keys are ERRORS, not silent no-ops.  Check the plan first:
#   python run.py --config configs/experiments.yaml --dry-run
#
# The defaults below are deliberately small (2 images per task) so the whole thing is a
# usable end-to-end test.  Raise num_images and lengthen the sweeps once it runs clean.
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto             # auto | gpu | tpu | cpu
  output_root: outputs
  cache_root: cache
  release_model_after_use: auto # true keeps JiT (Torch) and pMF (JAX) from co-residing
  continue_on_experiment_error: true
  progress_bars: true
  save_individual_images: true
  verbose: true
  max_atomic_jobs: 256          # sweep-explosion guard; override with --max-jobs
  resume: true                  # reuse finished jobs whose resolved spec matches exactly
  replicate: 0                  # stochastic trial index; changing it changes epsilon
  gpu_memory_profiling: true    # per-job GPU peak memory (cheap, non-invasive; --no-gpu-memory
                                # turns it off).  Reported per JOB at its batch size, never
                                # divided by the batch -- see docs/methods_pnp_dflow.md.
  nvml_sample_interval: 0.02    # sampling period used only where a framework allocator
                                # high-water mark is unavailable (the JAX path)

data:
  # The run these results come from used data.source: local_folder, because ILSVRC/imagenet-1k
  # is gated and that machine had no HF_TOKEN.  Committed as hf_imagenet_val so the file works
  # anywhere; the exact configuration each run executed is preserved in its own
  # outputs/<run_id>/config.yaml.
  source: hf_imagenet_val       # hf_imagenet_val | local_folder
  local_folder: ""
  image_size: 256

# Technical model integration only -- never experiment participation.
models:
  jit:
    variant: JiT-B/16
    batch_size: 2
  pmf:
    batch_size: 2
  sit:
    batch_size: 2               # SiT-XL/2, SD-VAE latent 4x32x32, Torch, standard flow
  imf:
    batch_size: 2               # iMF-B-2, SD-VAE latent 32x32x4, JAX, MeanFlow
    vae_decode_batch: 2         # the repository default (8) compiles a pmap decode that XLA
                                # cannot schedule below ~17.7 GiB; 2 matches batch_size and
                                # leaves headroom on a 24 GB card

# Method-level defaults inherited by every experiment that does not override them.
#
# `phi_normalization` is deliberately NOT set here.  Its per-method builtin default is
#   MPC            half_sum_squared                    (unchanged; Table E2's lambdas
#                                                        were tuned against this scale)
#   PnP / D-Flow   half_mean_squared_per_measurement   (F_b = 1/(2 m_b) * sum of squares,
#                                                        summed over the batch)
# Setting it globally here would silently override the second one, so if you want a single
# fidelity scale for every method, write it under each method instead and retune gamma0,
# lr and lam accordingly.
defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: true

metrics:
  lpips: true                   # headline metric; do not disable for a real benchmark
  lpips_net: alex

# =====================================================================================
# FULL BENCHMARK -- all 6 inverse problems x all 4 models x all 6 strategies
# =====================================================================================
# 6 tasks x 4 models (JiT, SiT, pMF, iMF) x 6 methods = 144 atomic jobs, 4 images each.
#
# HYPERPARAMETERS ARE THE ONES TUNED BY THE DENOISING HPO, not the shipped defaults.
# That sweep (kept in configs/experiments_sit_imf_hpo.yaml, results in
# outputs/hpo_denoising/) found:
#
#   rhso   lr = 0.05, mu = 0.0     -- the shipped lr = 0.01 scored WORSE than doing nothing
#                                     (LPIPS ~0.66 vs ~0.40); mu > 0 hurt in every pair where
#                                     the method actually worked, so the penalty stays off.
#   dflow  num_opt_steps = 20, lr = 0.05  -- the best of the four swept points, though D-Flow
#                                     still never beat the degraded observation on denoising.
#   pnp    gamma0 = 1.0            -- 0.5 / 1.0 / 2.0 were indistinguishable on iMF (identical
#                                     LPIPS to four decimals) and moved SiT by ~0.005, so this
#                                     knob is left at its nominal value.
#   mpc_*  lam LEFT UNSET          -- it falls back to MPC-Flow Table E2 per task, recorded as
#                                     `paper_E2`.  The denoising sweep showed E2's Delta-t
#                                     lambda transfers but its RHC lambda is ~5x too small;
#                                     that was measured on ONE task, so it is NOT extrapolated
#                                     to the other five here.  Sweep lam per task before
#                                     quoting any MPC-RHC number as tuned.
#   beta = 1.0 everywhere          -- the legacy uniform grid.  beta was tuned only on iMF and
#                                     the effect was small (0.3996 vs 0.4173); mixing a tuned
#                                     beta on two models with an untuned one on the other two
#                                     would make the cross-model column dishonest.
#
# t0 = 0.8 for every method so each strategy is compared against a paired SDEdit at ITS OWN
# t0, which is the whole point of the repository.
#
# This is NOT the default configuration -- configs/experiments.yaml is, and it is left at
# the repository's own JiT/pMF workload.  Run this one explicitly:
#   python run.py --config configs/experiments_full_benchmark.yaml --dry-run
# =====================================================================================
experiments:

  # ------------------------------------------------------------------- 1. denoising
  denoising:
    enabled: true
    problem: denoising
    num_images: 4
    degradation:
      sigma: 0.20               # the paper's setting; degraded PSNR is then ~20.5 dB
    models:
      jit:                    # standard flow, pixel 3x256x256, Torch
        methods:
          sdedit:      {t0: 0.8, steps: 4, solver: heun}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: 1}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 1.0}
          dflow:       {t0: 0.8, steps: 4, solver: heun, num_opt_steps: 20, lr: 0.05}
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 10, solver: heun,
                        lr: 0.05, mu: 0.0}
      sit:                    # standard flow, SD-VAE latent 4x32x32, Torch
        methods:
          sdedit:      {t0: 0.8, steps: 4, solver: heun}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: 1}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 1.0}
          dflow:       {t0: 0.8, steps: 4, solver: heun, num_opt_steps: 20, lr: 0.05}
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 10, solver: heun,
                        lr: 0.05, mu: 0.0}
      pmf:                    # MeanFlow, pixel 256x256x3, JAX -- `solver` rejected
        methods:
          sdedit:      {t0: 0.8, steps: 2}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: 1}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 1.0}
          dflow:       {t0: 0.8, steps: 2, num_opt_steps: 20, lr: 0.05}
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 10, lr: 0.05, mu: 0.0}
      imf:                    # MeanFlow, SD-VAE latent 32x32x4, JAX -- `solver` rejected
        methods:
          sdedit:      {t0: 0.8, steps: 2}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: 1}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 1.0}
          dflow:       {t0: 0.8, steps: 2, num_opt_steps: 20, lr: 0.05}
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 10, lr: 0.05, mu: 0.0}

  # ------------------------------------------------------------------- 2. deblurring
  deblurring:
    enabled: true
    problem: deblur
    num_images: 4
    degradation:
      sigma: 0.05
      blur_sigma: 1.0
      kernel_size: 7            # the paper fixes only blur_sigma; the support is our choice
      padding: reflect
    models:
      jit:                    # standard flow, pixel 3x256x256, Torch
        methods:
          sdedit:      {t0: 0.8, steps: 4, solver: heun}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: 1}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 1.0}
          dflow:       {t0: 0.8, steps: 4, solver: heun, num_opt_steps: 20, lr: 0.05}
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 10, solver: heun,
                        lr: 0.05, mu: 0.0}
      sit:                    # standard flow, SD-VAE latent 4x32x32, Torch
        methods:
          sdedit:      {t0: 0.8, steps: 4, solver: heun}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: 1}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 1.0}
          dflow:       {t0: 0.8, steps: 4, solver: heun, num_opt_steps: 20, lr: 0.05}
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 10, solver: heun,
                        lr: 0.05, mu: 0.0}
      pmf:                    # MeanFlow, pixel 256x256x3, JAX -- `solver` rejected
        methods:
          sdedit:      {t0: 0.8, steps: 2}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: 1}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 1.0}
          dflow:       {t0: 0.8, steps: 2, num_opt_steps: 20, lr: 0.05}
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 10, lr: 0.05, mu: 0.0}
      imf:                    # MeanFlow, SD-VAE latent 32x32x4, JAX -- `solver` rejected
        methods:
          sdedit:      {t0: 0.8, steps: 2}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: 1}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 1.0}
          dflow:       {t0: 0.8, steps: 2, num_opt_steps: 20, lr: 0.05}
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 10, lr: 0.05, mu: 0.0}

  # ------------------------------------------------------------------- 3. super-resolution
  # A is a REAL low-resolution operator, so y is 128x128.  The 256x256 bicubic lift is
  # the INITIALISATION GUIDE only and never enters any objective.
  super_resolution:
    enabled: true
    problem: super_resolution
    num_images: 4
    degradation:
      sigma: 0.05
      factor: 2
    models:
      jit:                    # standard flow, pixel 3x256x256, Torch
        methods:
          sdedit:      {t0: 0.8, steps: 4, solver: heun}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: 1}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 1.0}
          dflow:       {t0: 0.8, steps: 4, solver: heun, num_opt_steps: 20, lr: 0.05}
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 10, solver: heun,
                        lr: 0.05, mu: 0.0}
      sit:                    # standard flow, SD-VAE latent 4x32x32, Torch
        methods:
          sdedit:      {t0: 0.8, steps: 4, solver: heun}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: 1}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 1.0}
          dflow:       {t0: 0.8, steps: 4, solver: heun, num_opt_steps: 20, lr: 0.05}
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 10, solver: heun,
                        lr: 0.05, mu: 0.0}
      pmf:                    # MeanFlow, pixel 256x256x3, JAX -- `solver` rejected
        methods:
          sdedit:      {t0: 0.8, steps: 2}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: 1}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 1.0}
          dflow:       {t0: 0.8, steps: 2, num_opt_steps: 20, lr: 0.05}
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 10, lr: 0.05, mu: 0.0}
      imf:                    # MeanFlow, SD-VAE latent 32x32x4, JAX -- `solver` rejected
        methods:
          sdedit:      {t0: 0.8, steps: 2}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: 1}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 1.0}
          dflow:       {t0: 0.8, steps: 2, num_opt_steps: 20, lr: 0.05}
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 10, lr: 0.05, mu: 0.0}

  # ------------------------------------------------------------------- 4. box inpainting
  # The guide is the zero-filled masked observation: no Telea / Navier-Stokes prefill and
  # no hard per-step projection.  m_b counts only OBSERVED entries.
  box_inpainting:
    enabled: true
    problem: box_inpaint
    num_images: 4
    degradation:
      sigma: 0.05
      box: 40
    models:
      jit:                    # standard flow, pixel 3x256x256, Torch
        methods:
          sdedit:      {t0: 0.8, steps: 4, solver: heun}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: 1}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 1.0}
          dflow:       {t0: 0.8, steps: 4, solver: heun, num_opt_steps: 20, lr: 0.05}
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 10, solver: heun,
                        lr: 0.05, mu: 0.0}
      sit:                    # standard flow, SD-VAE latent 4x32x32, Torch
        methods:
          sdedit:      {t0: 0.8, steps: 4, solver: heun}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: 1}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 1.0}
          dflow:       {t0: 0.8, steps: 4, solver: heun, num_opt_steps: 20, lr: 0.05}
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 10, solver: heun,
                        lr: 0.05, mu: 0.0}
      pmf:                    # MeanFlow, pixel 256x256x3, JAX -- `solver` rejected
        methods:
          sdedit:      {t0: 0.8, steps: 2}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: 1}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 1.0}
          dflow:       {t0: 0.8, steps: 2, num_opt_steps: 20, lr: 0.05}
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 10, lr: 0.05, mu: 0.0}
      imf:                    # MeanFlow, SD-VAE latent 32x32x4, JAX -- `solver` rejected
        methods:
          sdedit:      {t0: 0.8, steps: 2}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: 1}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 1.0}
          dflow:       {t0: 0.8, steps: 2, num_opt_steps: 20, lr: 0.05}
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 10, lr: 0.05, mu: 0.0}

  # ------------------------------------------------------------------- 5. random inpainting
  random_inpainting:
    enabled: true
    problem: random_inpaint
    num_images: 4
    degradation:
      sigma: 0.01
      missing_fraction: 0.70
    models:
      jit:                    # standard flow, pixel 3x256x256, Torch
        methods:
          sdedit:      {t0: 0.8, steps: 4, solver: heun}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: 1}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 1.0}
          dflow:       {t0: 0.8, steps: 4, solver: heun, num_opt_steps: 20, lr: 0.05}
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 10, solver: heun,
                        lr: 0.05, mu: 0.0}
      sit:                    # standard flow, SD-VAE latent 4x32x32, Torch
        methods:
          sdedit:      {t0: 0.8, steps: 4, solver: heun}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: 1}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 1.0}
          dflow:       {t0: 0.8, steps: 4, solver: heun, num_opt_steps: 20, lr: 0.05}
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 10, solver: heun,
                        lr: 0.05, mu: 0.0}
      pmf:                    # MeanFlow, pixel 256x256x3, JAX -- `solver` rejected
        methods:
          sdedit:      {t0: 0.8, steps: 2}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: 1}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 1.0}
          dflow:       {t0: 0.8, steps: 2, num_opt_steps: 20, lr: 0.05}
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 10, lr: 0.05, mu: 0.0}
      imf:                    # MeanFlow, SD-VAE latent 32x32x4, JAX -- `solver` rejected
        methods:
          sdedit:      {t0: 0.8, steps: 2}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: 1}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 1.0}
          dflow:       {t0: 0.8, steps: 2, num_opt_steps: 20, lr: 0.05}
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 10, lr: 0.05, mu: 0.0}

  # ------------------------------------------------------------------- 6. stroke painting
  # SLIC stroke geometry is extracted with the original SDEdit algorithm and then FROZEN;
  # y comes from the differentiable renderer that every objective also optimises against.
  # No MPC-Flow Table E2 entry exists for this task -> lam/n_ctrl/lr are repository defaults.
  stroke_painting:
    enabled: true
    problem: stroke_painting
    num_images: 4
    degradation:
      preset: medium            # sparse | medium | dense
      sigma: 0.0
      blur_sigma: 0.8
    models:
      jit:                    # standard flow, pixel 3x256x256, Torch
        methods:
          sdedit:      {t0: 0.8, steps: 4, solver: heun}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: 1}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 1.0}
          dflow:       {t0: 0.8, steps: 4, solver: heun, num_opt_steps: 20, lr: 0.05}
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 10, solver: heun,
                        lr: 0.05, mu: 0.0}
      sit:                    # standard flow, SD-VAE latent 4x32x32, Torch
        methods:
          sdedit:      {t0: 0.8, steps: 4, solver: heun}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: 1}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: 1.0, alpha: 1.0}
          dflow:       {t0: 0.8, steps: 4, solver: heun, num_opt_steps: 20, lr: 0.05}
          rhso:        {t0: 0.8, num_rhso_steps: 4, num_opt_steps: 10, solver: heun,
                        lr: 0.05, mu: 0.0}
      pmf:                    # MeanFlow, pixel 256x256x3, JAX -- `solver` rejected
        methods:
