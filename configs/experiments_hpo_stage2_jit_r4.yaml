# Stage-2 follow-up round for jit (generated by scripts/hpo_stage2_round.py from outputs/stage2_jit, outputs/stage2_jit_r2, outputs/stage2_jit_r3):
# one step further out on every axis where the 8-image winner still sat on the edge of everything tried.
runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: true
  verbose: true
  max_atomic_jobs: 4000
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02

data:
  source: local_folder
  local_folder: "cache/data/imagenet_val_100"
  image_size: 256

models:
  jit:
    variant: JiT-B/16

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false

metrics:
  lpips: true
  lpips_net: alex

experiments:


  deblurring__dflow__x1:
    enabled: true
    problem: deblur
    num_images: 8
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      jit:
        batch_size: 4
        methods:
          dflow: {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 10240, lr: 0.3}   # edge:num_opt_steps+

  deblurring__mpc_delta_t__x1:
    enabled: true
    problem: deblur
    num_images: 8
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      jit:
        batch_size: 4
        methods:
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 640, lam: 1000, lr: 0.1}   # edge:n_ctrl+

  box_inpainting__dflow__x1:
    enabled: true
    problem: box_inpaint
    num_images: 8
    degradation: {sigma: 0.05, box: 40}
    models:
      jit:
        batch_size: 4
        methods:
          dflow: {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 10240, lr: 0.3}   # edge:num_opt_steps+
