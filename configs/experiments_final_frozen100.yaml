          rhso:        {t0: 1.0, solver: heun, num_rhso_steps: 8, num_opt_steps: 80, lr: 0.03, mu: 0}   # Stage-2 LPIPS 0.2356 PSNR 24.58 at 8 images
      pmf:
        batch_size: 10
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.01, mu: 0.2}   # Stage-2 LPIPS 0.1072 PSNR 26.66 at 8 images
      imf:
        batch_size: 4
