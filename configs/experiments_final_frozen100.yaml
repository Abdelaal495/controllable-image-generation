          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 640, lr: 0.3}   # Stage-2 LPIPS 0.3199 PSNR 23.61 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, lam: 540, lr: 0.3}   # Stage-2 LPIPS 0.2203 PSNR 25.11 at 8 images
      pmf:
        batch_size: 10
        methods:
