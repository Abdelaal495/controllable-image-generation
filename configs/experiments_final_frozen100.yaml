    problem: random_inpaint
    num_images: 100
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      jit:
        batch_size: 8
        methods:
          rhso:        {t0: 1.0, solver: heun, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.01, mu: 0}   # Stage-2 LPIPS 0.0919 PSNR 26.99 at 8 images
      sit:
        batch_size: 6
