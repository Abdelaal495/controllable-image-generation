          pnp:         {t0: 1.0, num_pnp_steps: 20, gamma0: 100000.0, alpha: 0.1}   # Stage-2 LPIPS 0.1286 PSNR 25.24 at 8 images
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 640, lr: 0.03}   # Stage-2 LPIPS 0.1891 PSNR 25.56 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 40, lam: 360, lr: 0.15}   # Stage-2 LPIPS 0.0938 PSNR 26.52 at 8 images
      imf:
        batch_size: 4
        methods:
          sdedit:      {t0: 1.0, steps: 8}   # Stage-2 LPIPS 0.7558 PSNR 9.75 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 200, gamma0: 100000.0, alpha: 1}   # Stage-2 LPIPS 0.3570 PSNR 24.93 at 8 images
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 640, lr: 0.3}   # Stage-2 LPIPS 0.3594 PSNR 24.03 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 40, lam: 1000, lr: 0.3}   # Stage-2 LPIPS 0.2376 PSNR 25.18 at 8 images

  super_resolution__rhc:
    enabled: true
    problem: super_resolution
    num_images: 100
    degradation: {sigma: 0.05, factor: 2}
    models:
      jit:
        batch_size: 10
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 2, lam: 720, lr: 0.05}   # Stage-2 LPIPS 0.1491 PSNR 26.11 at 8 images
