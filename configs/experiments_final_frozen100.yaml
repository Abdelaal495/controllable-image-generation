          rhso:        {t0: 1.0, solver: heun, num_rhso_steps: 8, num_opt_steps: 80, lr: 0.03, mu: 0}   # Stage-2 LPIPS 0.2061 PSNR 24.99 at 8 images
      pmf:
        batch_size: 10
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.01, mu: 0}   # Stage-2 LPIPS 0.1026 PSNR 26.80 at 8 images
      imf:
