          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 20, lam: 180, lr: 0.1}   # Stage-2 LPIPS 0.0401 PSNR 30.92 at 8 images
      sit:
        batch_size: 16
        methods:
