# =====================================================================================
# FINAL BENCHMARK at t0 = 1.0 on the frozen ImageNet-100 (class seed 42 / image seed 43)
# =====================================================================================
#
#   python scripts/build_local_imagenet_pool.py --frozen-manifest benchmarks/imagenet100_c42_i43/manifest.csv
#   python run.py --config configs/experiments_final_frozen100.yaml --models jit --run-id final_jit --no-figures
#
# All four priors in one file; run one per GPU with --models.  Generated by
# scripts/make_final_frozen100_configs.py --grid-only from stage2_imf, stage2_jit, stage2_pmf, stage2_sit (+ follow-up rounds): every entry is the lowest-LPIPS
# Stage-2 configuration of its cell among the candidates inside the Stage-1 grid, and the trailing comment is that
# Stage-2 score.  Each problem is split into __core / __rhc / __rhso so batch_size can follow
# memory use.
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: true
  verbose: true
  max_atomic_jobs: 200
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02

data:
  # Written by scripts/build_local_imagenet_pool.py; point it at your copy.
  source: local_folder
  local_folder: "cache/data/imagenet100_c42_i43_mirror"
  image_size: 256

models:
  jit:
    variant: JiT-B/16
  sit: {}
  pmf: {}
  imf: {}

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false

metrics:
  lpips: true
  lpips_net: alex

experiments:


  denoising__core:
    enabled: true
    problem: denoising
    num_images: 100
    degradation: {sigma: 0.20}
    models:
      jit:
        batch_size: 20
        methods:
          sdedit:      {t0: 1.0, solver: heun, steps: 25}   # Stage-2 LPIPS 0.7152 PSNR 9.22 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 50, gamma0: 200000.0, alpha: 0.5}   # Stage-2 LPIPS 0.0986 PSNR 28.00 at 8 images
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 640, lr: 0.3}   # Stage-2 LPIPS 0.4802 PSNR 23.38 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 20, lam: 30, lr: 0.3}   # Stage-2 LPIPS 0.1854 PSNR 27.31 at 8 images
      sit:
        batch_size: 16
        methods:
          sdedit:      {t0: 1.0, solver: heun, steps: 1}   # Stage-2 LPIPS 0.7143 PSNR 9.72 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 200, gamma0: 100000.0, alpha: 0.5}   # Stage-2 LPIPS 0.4621 PSNR 24.42 at 8 images
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 640, lr: 0.3}   # Stage-2 LPIPS 0.3068 PSNR 24.43 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 40, lam: 180, lr: 0.3}   # Stage-2 LPIPS 0.2104 PSNR 26.05 at 8 images
      pmf:
        batch_size: 10
        methods:
          sdedit:      {t0: 1.0, steps: 2}   # Stage-2 LPIPS 0.7136 PSNR 9.35 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 10, gamma0: 200000.0, alpha: 0.1}   # Stage-2 LPIPS 0.0787 PSNR 27.31 at 8 images
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 320, lr: 0.1}   # Stage-2 LPIPS 0.2101 PSNR 26.34 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 20, lam: 30, lr: 0.15}   # Stage-2 LPIPS 0.1670 PSNR 27.38 at 8 images
      imf:
        batch_size: 4
        methods:
          sdedit:      {t0: 1.0, steps: 8}   # Stage-2 LPIPS 0.7558 PSNR 9.75 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 200, gamma0: 100000.0, alpha: 1}   # Stage-2 LPIPS 0.3597 PSNR 25.11 at 8 images
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 640, lr: 0.3}   # Stage-2 LPIPS 0.3657 PSNR 24.65 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 40, lam: 360, lr: 0.3}   # Stage-2 LPIPS 0.2357 PSNR 26.29 at 8 images

  denoising__rhc:
    enabled: true
    problem: denoising
    num_images: 100
    degradation: {sigma: 0.20}
    models:
      jit:
        batch_size: 10
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 2, lam: 15, lr: 0.05}   # Stage-2 LPIPS 0.1144 PSNR 28.29 at 8 images
      sit:
        batch_size: 10
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 1, lam: 5, lr: 0.2}   # Stage-2 LPIPS 0.2563 PSNR 25.74 at 8 images
      pmf:
        batch_size: 5
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 2, lam: 30, lr: 0.1}   # Stage-2 LPIPS 0.1052 PSNR 28.18 at 8 images
      imf:
        batch_size: 4
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 1, lam: 15, lr: 0.2}   # Stage-2 LPIPS 0.2651 PSNR 26.03 at 8 images

  denoising__rhso:
    enabled: true
    problem: denoising
    num_images: 100
    degradation: {sigma: 0.20}
    models:
      jit:
        batch_size: 8
        methods:
          rhso:        {t0: 1.0, solver: heun, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.005, mu: 0.2}   # Stage-2 LPIPS 0.1343 PSNR 27.41 at 8 images
      sit:
        batch_size: 6
        methods:
          rhso:        {t0: 1.0, solver: heun, num_rhso_steps: 8, num_opt_steps: 80, lr: 0.03, mu: 0}   # Stage-2 LPIPS 0.2287 PSNR 26.21 at 8 images
      pmf:
        batch_size: 10
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.03, mu: 1}   # Stage-2 LPIPS 0.0905 PSNR 28.32 at 8 images
      imf:
        batch_size: 4
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 8, num_opt_steps: 80, lr: 0.03, mu: 0}   # Stage-2 LPIPS 0.2271 PSNR 26.36 at 8 images

  deblurring__core:
    enabled: true
    problem: deblur
    num_images: 100
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      jit:
        batch_size: 20
        methods:
          sdedit:      {t0: 1.0, solver: heun, steps: 25}   # Stage-2 LPIPS 0.7152 PSNR 9.22 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 200, gamma0: 1200000.0, alpha: 0.5}   # Stage-2 LPIPS 0.1720 PSNR 28.28 at 8 images
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 640, lr: 0.3}   # Stage-2 LPIPS 0.5283 PSNR 22.72 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 40, lam: 1000, lr: 0.1}   # Stage-2 LPIPS 0.1445 PSNR 28.68 at 8 images
      sit:
        batch_size: 16
        methods:
          sdedit:      {t0: 1.0, solver: heun, steps: 1}   # Stage-2 LPIPS 0.7143 PSNR 9.72 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 200, gamma0: 100000.0, alpha: 0.5}   # Stage-2 LPIPS 0.4926 PSNR 24.07 at 8 images
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 640, lr: 0.3}   # Stage-2 LPIPS 0.3685 PSNR 23.16 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 40, lam: 360, lr: 0.3}   # Stage-2 LPIPS 0.2275 PSNR 25.72 at 8 images
      pmf:
        batch_size: 10
        methods:
          sdedit:      {t0: 1.0, steps: 2}   # Stage-2 LPIPS 0.7136 PSNR 9.35 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 200, gamma0: 5000000.0, alpha: 1}   # Stage-2 LPIPS 0.1389 PSNR 27.33 at 8 images
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 640, lr: 0.03}   # Stage-2 LPIPS 0.2901 PSNR 24.82 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 40, lam: 1000, lr: 0.1}   # Stage-2 LPIPS 0.1352 PSNR 28.62 at 8 images
      imf:
        batch_size: 4
        methods:
          sdedit:      {t0: 1.0, steps: 8}   # Stage-2 LPIPS 0.7558 PSNR 9.75 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 200, gamma0: 100000.0, alpha: 1}   # Stage-2 LPIPS 0.4113 PSNR 24.52 at 8 images
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 640, lr: 0.3}   # Stage-2 LPIPS 0.3882 PSNR 24.24 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 40, lam: 1000, lr: 0.3}   # Stage-2 LPIPS 0.2567 PSNR 26.14 at 8 images

  deblurring__rhc:
    enabled: true
    problem: deblur
    num_images: 100
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      jit:
        batch_size: 10
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 1, lam: 60, lr: 0.05}   # Stage-2 LPIPS 0.1672 PSNR 28.26 at 8 images
      sit:
        batch_size: 10
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 1, lam: 720, lr: 0.2}   # Stage-2 LPIPS 0.2890 PSNR 25.75 at 8 images
      pmf:
        batch_size: 5
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 1, lam: 60, lr: 0.2}   # Stage-2 LPIPS 0.1524 PSNR 28.09 at 8 images
      imf:
        batch_size: 4
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 1, lam: 180, lr: 0.2}   # Stage-2 LPIPS 0.3011 PSNR 25.85 at 8 images

  deblurring__rhso:
    enabled: true
