        methods:
          rhso:        {t0: 1.0, solver: heun, num_rhso_steps: 8, num_opt_steps: 20, lr: 0.01, mu: 0}   # Stage-2 LPIPS 0.0965 PSNR 29.04 at 8 images
      sit:
        batch_size: 6
        methods:
          rhso:        {t0: 1.0, solver: heun, num_rhso_steps: 8, num_opt_steps: 80, lr: 0.03, mu: 0}   # Stage-2 LPIPS 0.2305 PSNR 25.75 at 8 images
      pmf:
        batch_size: 10
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 8, num_opt_steps: 20, lr: 0.01, mu: 0}   # Stage-2 LPIPS 0.1211 PSNR 29.00 at 8 images
      imf:
        batch_size: 4
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 8, num_opt_steps: 80, lr: 0.03, mu: 0}   # Stage-2 LPIPS 0.2467 PSNR 25.90 at 8 images

  super_resolution__core:
    enabled: true
    problem: super_resolution
    num_images: 100
    degradation: {sigma: 0.05, factor: 2}
    models:
      jit:
        batch_size: 20
        methods:
          sdedit:      {t0: 1.0, solver: heun, steps: 25}   # Stage-2 LPIPS 0.7152 PSNR 9.22 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 20, gamma0: 200000.0, alpha: 0.25}   # Stage-2 LPIPS 0.0937 PSNR 26.24 at 8 images
