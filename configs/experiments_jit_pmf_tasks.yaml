# =====================================================================================
# JiT / pMF sweep across all six inverse problems -- 8 images
# =====================================================================================
#
# NOT the default configuration.  Run explicitly:
#   python run.py --config configs/experiments_jit_pmf_tasks.yaml --dry-run
#
# The pixel-space counterpart of configs/experiments_sit_imf_tasks.yaml, so that the four
# models can eventually be put in one table.  It is NOT a copy of that file: three things
# had to change, and each change is a result from the latent sweeps.
#
# 1. THE LAMBDA GRID IS CENTRED SOMEWHERE ELSE.
#    On the latent models the LPIPS-vs-lambda curve is a plateau: it falls, flattens around
#    lambda ~ 50 and stays flat to 500, so the grid there brackets the plateau entry.  The
#    pixel control arm (configs/experiments_lambda_pixel_control.yaml) found the opposite
#    shape -- a valley with a sharp interior minimum, JiT MPC-RHC best at lambda = 5 with
#    every other value worse on all eight images, and lambda = 500 giving back more than it
#    gained.  Re-using the latent grid here would step straight over the optimum, so the
#    grid is [1, 5, 15, 50] for RHC and [5, 15, 30, 100] for Delta-t.
#
# 2. phi_normalization IS SWEPT, not fixed.
#    On the latent models PnP's default per-measurement scale divided the fidelity term by
#    196,608 and left gamma0 inert; half_sum_squared fixed it.  That divisor is the size of
#    the MEASUREMENT, which is 196,608 for a 256x256 RGB image whatever space the model
#    works in, so the same failure should appear here.  "Should" is not "does": both scales
#    are swept so the mechanism is tested on pixel models rather than assumed.
#
# 3. K IS SWEPT for MPC-RHC.
#    K = 1 won on the latent models, but the control variable there has 4,096 dimensions
#    against 196,608 here, and K sets how much of the horizon is optimised jointly.  It is
#    cheap on these models (JiT MPC-RHC costs 0.15 s/image), so K = 3 is worth its budget.
#
# CARRIED OVER from the latent sweeps: mu = 0 for RHSO, and solver = heun for the two
# standard flows.
#
# *** THE mu = 0 CARRY-OVER WAS A MISTAKE AND THIS FILE IS AFFECTED. ***  "Nothing about
# the state space bears on it" was an assumption, not a measurement, and it was wrong in
# exactly the way lambda had already been wrong: configs/experiments_round4.yaml swept mu
# on JiT and pMF and mu > 0 won all 12 cells, by up to 0.35 LPIPS.  Every RHSO row this
# file produced is therefore a mu = 0 row and understates RHSO on pixel models.  Use the
# round-4 numbers in docs/best_hyperparameters.md instead.
#
# t0 = 0.8 throughout, matching every other sweep, so each strategy is scored against a
# paired SDEdit at the same corruption strength.
#
# For the two inpainting problems read missing_psnr alongside LPIPS: full-image metrics
# there are dominated by the pixels the measurement already gives you.
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: true
  verbose: true
  max_atomic_jobs: 600
  resume: true
  replicate: 0
  gpu_memory_profiling: true

data:
  # Executed with data.source: local_folder on a machine without an HF token; committed as
  # hf_imagenet_val so the file works anywhere.
  source: hf_imagenet_val
  local_folder: ""
  image_size: 256

models:
  jit:
    variant: JiT-B/16
    batch_size: 2
  pmf:
    batch_size: 2

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: true

metrics:
  lpips: true
  lpips_net: alex

experiments:

  denoising:
    enabled: true
    problem: denoising
    num_images: 8
    degradation: {sigma: 0.20}
    models:
      jit:                    # pixel 3x256x256, standard flow
        methods:
          sdedit:      {t0: 0.8, steps: [4, 25], solver: heun}
          rhso:        {t0: 0.8, num_rhso_steps: 4, solver: heun, mu: 0.0,
                        beta: [0.25, 0.5], num_opt_steps: [20, 40], lr: [0.05, 0.1]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4, n_ctrl: [20, 40],
                        lam: [5.0, 15.0, 30.0, 100.0]}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: [1, 3], n_ctrl: 20,
                        lam: [1.0, 5.0, 15.0, 50.0]}
          dflow:       {t0: 0.8, steps: 2, solver: heun,
                        num_opt_steps: [40, 80], lr: [0.05, 0.1]}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: [0.25, 0.5, 1.0],
                        alpha: [0.5, 1.0],
                        phi_normalization: [half_sum_squared,
                                            half_mean_squared_per_measurement]}
      pmf:                    # pixel 256x256x3, MeanFlow -- `solver` rejected
        methods:
          sdedit:      {t0: 0.8, steps: [1, 2]}
          rhso:        {t0: 0.8, num_rhso_steps: 4, mu: 0.0,
                        beta: [0.25, 0.5], num_opt_steps: [10, 20], lr: [0.05, 0.1]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2, n_ctrl: [20, 40],
                        lam: [5.0, 15.0, 30.0, 100.0]}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: [1, 3], n_ctrl: 20,
                        lam: [1.0, 5.0, 15.0, 50.0]}
          dflow:       {t0: 0.8, steps: 2, num_opt_steps: [40, 80], lr: [0.05, 0.1]}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: [0.25, 0.5, 1.0],
                        alpha: [0.5, 1.0],
                        phi_normalization: [half_sum_squared,
                                            half_mean_squared_per_measurement]}

  deblurring:
    enabled: true
    problem: deblur
    num_images: 8
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      jit:                    # pixel 3x256x256, standard flow
        methods:
          sdedit:      {t0: 0.8, steps: [4, 25], solver: heun}
          rhso:        {t0: 0.8, num_rhso_steps: 4, solver: heun, mu: 0.0,
                        beta: [0.25, 0.5], num_opt_steps: [20, 40], lr: [0.05, 0.1]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4, n_ctrl: [20, 40],
                        lam: [5.0, 15.0, 30.0, 100.0]}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: [1, 3], n_ctrl: 20,
                        lam: [1.0, 5.0, 15.0, 50.0]}
          dflow:       {t0: 0.8, steps: 2, solver: heun,
                        num_opt_steps: [40, 80], lr: [0.05, 0.1]}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: [0.25, 0.5, 1.0],
                        alpha: [0.5, 1.0],
                        phi_normalization: [half_sum_squared,
                                            half_mean_squared_per_measurement]}
      pmf:                    # pixel 256x256x3, MeanFlow -- `solver` rejected
        methods:
          sdedit:      {t0: 0.8, steps: [1, 2]}
          rhso:        {t0: 0.8, num_rhso_steps: 4, mu: 0.0,
                        beta: [0.25, 0.5], num_opt_steps: [10, 20], lr: [0.05, 0.1]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2, n_ctrl: [20, 40],
                        lam: [5.0, 15.0, 30.0, 100.0]}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: [1, 3], n_ctrl: 20,
                        lam: [1.0, 5.0, 15.0, 50.0]}
          dflow:       {t0: 0.8, steps: 2, num_opt_steps: [40, 80], lr: [0.05, 0.1]}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: [0.25, 0.5, 1.0],
                        alpha: [0.5, 1.0],
                        phi_normalization: [half_sum_squared,
                                            half_mean_squared_per_measurement]}

  super_resolution:
    enabled: true
    problem: super_resolution
    num_images: 8
    degradation: {sigma: 0.05, factor: 2}
    models:
      jit:                    # pixel 3x256x256, standard flow
        methods:
          sdedit:      {t0: 0.8, steps: [4, 25], solver: heun}
          rhso:        {t0: 0.8, num_rhso_steps: 4, solver: heun, mu: 0.0,
                        beta: [0.25, 0.5], num_opt_steps: [20, 40], lr: [0.05, 0.1]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4, n_ctrl: [20, 40],
                        lam: [5.0, 15.0, 30.0, 100.0]}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: [1, 3], n_ctrl: 20,
                        lam: [1.0, 5.0, 15.0, 50.0]}
          dflow:       {t0: 0.8, steps: 2, solver: heun,
                        num_opt_steps: [40, 80], lr: [0.05, 0.1]}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: [0.25, 0.5, 1.0],
                        alpha: [0.5, 1.0],
                        phi_normalization: [half_sum_squared,
                                            half_mean_squared_per_measurement]}
      pmf:                    # pixel 256x256x3, MeanFlow -- `solver` rejected
        methods:
          sdedit:      {t0: 0.8, steps: [1, 2]}
          rhso:        {t0: 0.8, num_rhso_steps: 4, mu: 0.0,
                        beta: [0.25, 0.5], num_opt_steps: [10, 20], lr: [0.05, 0.1]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2, n_ctrl: [20, 40],
                        lam: [5.0, 15.0, 30.0, 100.0]}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: [1, 3], n_ctrl: 20,
                        lam: [1.0, 5.0, 15.0, 50.0]}
          dflow:       {t0: 0.8, steps: 2, num_opt_steps: [40, 80], lr: [0.05, 0.1]}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: [0.25, 0.5, 1.0],
                        alpha: [0.5, 1.0],
                        phi_normalization: [half_sum_squared,
                                            half_mean_squared_per_measurement]}

  box_inpainting:
    enabled: true
    problem: box_inpaint
    num_images: 8
    degradation: {sigma: 0.05, box: 40}
    models:
      jit:                    # pixel 3x256x256, standard flow
        methods:
          sdedit:      {t0: 0.8, steps: [4, 25], solver: heun}
          rhso:        {t0: 0.8, num_rhso_steps: 4, solver: heun, mu: 0.0,
                        beta: [0.25, 0.5], num_opt_steps: [20, 40], lr: [0.05, 0.1]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4, n_ctrl: [20, 40],
                        lam: [5.0, 15.0, 30.0, 100.0]}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: [1, 3], n_ctrl: 20,
                        lam: [1.0, 5.0, 15.0, 50.0]}
          dflow:       {t0: 0.8, steps: 2, solver: heun,
                        num_opt_steps: [40, 80], lr: [0.05, 0.1]}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: [0.25, 0.5, 1.0],
                        alpha: [0.5, 1.0],
                        phi_normalization: [half_sum_squared,
                                            half_mean_squared_per_measurement]}
      pmf:                    # pixel 256x256x3, MeanFlow -- `solver` rejected
        methods:
          sdedit:      {t0: 0.8, steps: [1, 2]}
          rhso:        {t0: 0.8, num_rhso_steps: 4, mu: 0.0,
                        beta: [0.25, 0.5], num_opt_steps: [10, 20], lr: [0.05, 0.1]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2, n_ctrl: [20, 40],
                        lam: [5.0, 15.0, 30.0, 100.0]}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: [1, 3], n_ctrl: 20,
                        lam: [1.0, 5.0, 15.0, 50.0]}
          dflow:       {t0: 0.8, steps: 2, num_opt_steps: [40, 80], lr: [0.05, 0.1]}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: [0.25, 0.5, 1.0],
                        alpha: [0.5, 1.0],
                        phi_normalization: [half_sum_squared,
                                            half_mean_squared_per_measurement]}

  random_inpainting:
    enabled: true
    problem: random_inpaint
    num_images: 8
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      jit:                    # pixel 3x256x256, standard flow
        methods:
          sdedit:      {t0: 0.8, steps: [4, 25], solver: heun}
          rhso:        {t0: 0.8, num_rhso_steps: 4, solver: heun, mu: 0.0,
                        beta: [0.25, 0.5], num_opt_steps: [20, 40], lr: [0.05, 0.1]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4, n_ctrl: [20, 40],
                        lam: [5.0, 15.0, 30.0, 100.0]}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: [1, 3], n_ctrl: 20,
                        lam: [1.0, 5.0, 15.0, 50.0]}
          dflow:       {t0: 0.8, steps: 2, solver: heun,
                        num_opt_steps: [40, 80], lr: [0.05, 0.1]}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: [0.25, 0.5, 1.0],
                        alpha: [0.5, 1.0],
                        phi_normalization: [half_sum_squared,
                                            half_mean_squared_per_measurement]}
      pmf:                    # pixel 256x256x3, MeanFlow -- `solver` rejected
        methods:
          sdedit:      {t0: 0.8, steps: [1, 2]}
          rhso:        {t0: 0.8, num_rhso_steps: 4, mu: 0.0,
                        beta: [0.25, 0.5], num_opt_steps: [10, 20], lr: [0.05, 0.1]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2, n_ctrl: [20, 40],
                        lam: [5.0, 15.0, 30.0, 100.0]}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: [1, 3], n_ctrl: 20,
                        lam: [1.0, 5.0, 15.0, 50.0]}
          dflow:       {t0: 0.8, steps: 2, num_opt_steps: [40, 80], lr: [0.05, 0.1]}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: [0.25, 0.5, 1.0],
                        alpha: [0.5, 1.0],
                        phi_normalization: [half_sum_squared,
                                            half_mean_squared_per_measurement]}

  stroke_painting:
    enabled: true
    problem: stroke_painting
    num_images: 8
    degradation: {preset: medium, sigma: 0.0, blur_sigma: 0.8}
    models:
      jit:                    # pixel 3x256x256, standard flow
        methods:
          sdedit:      {t0: 0.8, steps: [4, 25], solver: heun}
          rhso:        {t0: 0.8, num_rhso_steps: 4, solver: heun, mu: 0.0,
                        beta: [0.25, 0.5], num_opt_steps: [20, 40], lr: [0.05, 0.1]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4, n_ctrl: [20, 40],
                        lam: [5.0, 15.0, 30.0, 100.0]}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: [1, 3], n_ctrl: 20,
                        lam: [1.0, 5.0, 15.0, 50.0]}
          dflow:       {t0: 0.8, steps: 2, solver: heun,
                        num_opt_steps: [40, 80], lr: [0.05, 0.1]}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: [0.25, 0.5, 1.0],
                        alpha: [0.5, 1.0],
                        phi_normalization: [half_sum_squared,
                                            half_mean_squared_per_measurement]}
      pmf:                    # pixel 256x256x3, MeanFlow -- `solver` rejected
        methods:
          sdedit:      {t0: 0.8, steps: [1, 2]}
          rhso:        {t0: 0.8, num_rhso_steps: 4, mu: 0.0,
                        beta: [0.25, 0.5], num_opt_steps: [10, 20], lr: [0.05, 0.1]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2, n_ctrl: [20, 40],
                        lam: [5.0, 15.0, 30.0, 100.0]}
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: [1, 3], n_ctrl: 20,
                        lam: [1.0, 5.0, 15.0, 50.0]}
          dflow:       {t0: 0.8, steps: 2, num_opt_steps: [40, 80], lr: [0.05, 0.1]}
          pnp:         {t0: 0.8, num_pnp_steps: 20, gamma0: [0.25, 0.5, 1.0],
                        alpha: [0.5, 1.0],
                        phi_normalization: [half_sum_squared,
                                            half_mean_squared_per_measurement]}
