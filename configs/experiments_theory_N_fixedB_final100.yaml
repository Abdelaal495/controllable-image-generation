# EXPERIMENT 2A -- LARGER N AT A FIXED TOTAL OPTIMISER BUDGET  B = N*M = 160
#
# SCIENTIFIC QUESTION
# -------------------
# Does distributing a FIXED optimisation budget over more stages keep helping, or is there
# an N beyond which per-stage starvation (M = B/N shrinks) undoes the benefit of
# replanning? The validated suite already covers N in {1, 2, 4, 8}; this extends the curve
# to N = 16 and N = 32, where M falls to 10 and 5 optimizer iterations per stage.
#
# HELD FIXED  : B = 160, t0 = 1.0 (canonical start s = 0), beta = 1.0, direct terminal
#               planning, 100 frozen images, seed 42, and each model's task-specific
#               learning rate and mu, which are not retuned per N.
# SWEPT       : (N, M) over the six MATCHED pairs below, and the model.
# DIAGNOSTICS : stage + consistency (the standard bookkeeping of the theory suite);
#               Jacobian and gradient-authority probes are OFF -- they belong in
#               configs/experiments_theory_gradient_authority.yaml.
#
# WHY ONE NAMED BLOCK PER PAIR
# ----------------------------
# num_rhso_steps and num_opt_steps are INDEPENDENT sweep axes: writing
#     num_rhso_steps: [1, 2, 4, 8, 16, 32]
#     num_opt_steps: [160, 80, 40, 20, 10, 5]
# in one block would expand to the 36-job Cartesian product, 30 of which have N*M != 160.
# Each matched pair therefore gets its own experiment block, exactly as
# configs/experiments_theory_validation_final100.yaml does.
#
# N = 1, 2, 4 and 8 are REPEATED here so the complete curve is reproducible from one
# config. They resolve to the same settings as the validated suite, but to different job
# ids (the experiment name takes part in the identity), so this file cannot overwrite or
# silently reuse the existing results -- and configs/experiments_theory_validation_final100
# .yaml is left untouched.
#
# CAPACITY-MATCHED MODELS
# -----------------------
# Two pairs of comparable size, so a MeanFlow-vs-standard-flow gap cannot be read as a
# capacity gap: pMF-L/16 (410 M) against JiT-L/16 (459 M) in pixel space, and iMF-XL/2
# (610 M) against SiT-XL/2 (675 M) in latent space.
#
# Expected scale: 5 tasks x 6 (N, M) pairs x 4 models = 120 atomic jobs.
# Verify with: python run.py --config configs/experiments_theory_N_fixedB_final100.yaml --dry-run

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: auto
  continue_on_experiment_error: true
  progress_bars: true
  save_individual_images: false
  verbose: true
  max_atomic_jobs: 256
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02

data:
  # The SAME frozen ImageNet-100 benchmark the final paper configuration uses
  # (class seed 42, image seed 43). Point `local_folder` at your copy.
  source: local_folder
  local_folder: /home/abdelaal/controllable-image-generation-benchmarks/imagenet100_c42_i43
  image_size: 256

models:
  jit:
    variant: JiT-L/16
    batch_size: 4
  pmf:
    batch_size: 10
  sit:
    batch_size: 6
  imf:
    display_name: iMF-XL/2
    ckpt_file: iMF-XL-2.zip
    model_str: imfDiT_XL_2
    guidance: {scale: 8.0, interval: [0.42, 0.62], mode: null}
    batch_size: 2

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false

metrics:
  lpips: true
  lpips_net: alex

experiments:

  denoising_B160_N1:
