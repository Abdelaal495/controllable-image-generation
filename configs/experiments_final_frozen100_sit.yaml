# =====================================================================================
# FINAL BENCHMARK at t0 = 1.0 on the paper's frozen ImageNet-100 (class seed 42 / image seed 43),
# model sit only -- one process per GPU.  Generated by scripts/make_final_frozen100_configs.py
# from outputs/stage2_sit: every entry is the lowest-LPIPS Stage-2 configuration of its cell (8 images) RESTRICTED TO THE STAGE-1 GRID (edge extensions excluded), the
# trailing comment is that Stage-2 score.  Layout as configs/experiments_t1_final.yaml
# (__core / __rhc / __rhso split by memory class; batch_size resolves per (experiment, model)).
#
#   python run.py --config configs/experiments_final_frozen100_sit.yaml --dry-run
#   CUDA_VISIBLE_DEVICES=<k> python -u run.py --config configs/experiments_final_frozen100_sit.yaml --run-id final_sit --no-figures
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: true
  verbose: true
  max_atomic_jobs: 200
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02

data:
  # Built by: python build_local_imagenet_pool.py --frozen-manifest benchmarks/imagenet100_c42_i43/manifest.csv
  source: local_folder
  local_folder: "cache/data/imagenet100_c42_i43_mirror"
  image_size: 256

models:
  sit: {}

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false

metrics:
  lpips: true
  lpips_net: alex

experiments:


  denoising__core:
    enabled: true
    problem: denoising
    num_images: 100
    degradation: {sigma: 0.20}
    models:
      sit:
        batch_size: 16
        methods:
          sdedit:      {t0: 1.0, solver: heun, steps: 1}   # Stage-2 LPIPS 0.7143 PSNR 9.72 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 200, gamma0: 100000.0, alpha: 0.5}   # Stage-2 LPIPS 0.4621 PSNR 24.42 at 8 images
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 640, lr: 0.3}   # Stage-2 LPIPS 0.3068 PSNR 24.43 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 40, lam: 180, lr: 0.3}   # Stage-2 LPIPS 0.2104 PSNR 26.05 at 8 images

  denoising__rhc:
    enabled: true
    problem: denoising
    num_images: 100
    degradation: {sigma: 0.20}
    models:
      sit:
        batch_size: 10
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 1, lam: 5, lr: 0.2}   # Stage-2 LPIPS 0.2563 PSNR 25.74 at 8 images

  denoising__rhso:
    enabled: true
    problem: denoising
    num_images: 100
    degradation: {sigma: 0.20}
    models:
      sit:
        batch_size: 6
        methods:
          rhso:        {t0: 1.0, solver: heun, num_rhso_steps: 8, num_opt_steps: 80, lr: 0.03, mu: 0}   # Stage-2 LPIPS 0.2287 PSNR 26.21 at 8 images

  deblurring__core:
    enabled: true
    problem: deblur
    num_images: 100
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      sit:
        batch_size: 16
        methods:
          sdedit:      {t0: 1.0, solver: heun, steps: 1}   # Stage-2 LPIPS 0.7143 PSNR 9.72 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 200, gamma0: 100000.0, alpha: 0.5}   # Stage-2 LPIPS 0.4926 PSNR 24.07 at 8 images
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 640, lr: 0.3}   # Stage-2 LPIPS 0.3685 PSNR 23.16 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 40, lam: 360, lr: 0.3}   # Stage-2 LPIPS 0.2275 PSNR 25.72 at 8 images

  deblurring__rhc:
    enabled: true
    problem: deblur
    num_images: 100
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      sit:
        batch_size: 10
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 1, lam: 720, lr: 0.2}   # Stage-2 LPIPS 0.2890 PSNR 25.75 at 8 images

  deblurring__rhso:
    enabled: true
    problem: deblur
    num_images: 100
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      sit:
        batch_size: 6
        methods:
          rhso:        {t0: 1.0, solver: heun, num_rhso_steps: 8, num_opt_steps: 80, lr: 0.03, mu: 0}   # Stage-2 LPIPS 0.2305 PSNR 25.75 at 8 images

  super_resolution__core:
    enabled: true
    problem: super_resolution
    num_images: 100
    degradation: {sigma: 0.05, factor: 2}
    models:
      sit:
        batch_size: 16
        methods:
          sdedit:      {t0: 1.0, solver: heun, steps: 1}   # Stage-2 LPIPS 0.7143 PSNR 9.72 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 200, gamma0: 200000.0, alpha: 1}   # Stage-2 LPIPS 0.4608 PSNR 24.55 at 8 images
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 640, lr: 0.3}   # Stage-2 LPIPS 0.3199 PSNR 23.61 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, lam: 540, lr: 0.3}   # Stage-2 LPIPS 0.2203 PSNR 25.11 at 8 images

  super_resolution__rhc:
    enabled: true
    problem: super_resolution
    num_images: 100
    degradation: {sigma: 0.05, factor: 2}
    models:
      sit:
        batch_size: 10
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 1, lam: 720, lr: 0.2}   # Stage-2 LPIPS 0.2458 PSNR 25.50 at 8 images

  super_resolution__rhso:
    enabled: true
    problem: super_resolution
    num_images: 100
    degradation: {sigma: 0.05, factor: 2}
    models:
      sit:
        batch_size: 6
        methods:
          rhso:        {t0: 1.0, solver: heun, num_rhso_steps: 8, num_opt_steps: 80, lr: 0.03, mu: 0}   # Stage-2 LPIPS 0.2356 PSNR 24.58 at 8 images

  random_inpainting__core:
    enabled: true
    problem: random_inpaint
    num_images: 100
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      sit:
        batch_size: 16
        methods:
          sdedit:      {t0: 1.0, solver: heun, steps: 1}   # Stage-2 LPIPS 0.7143 PSNR 9.72 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 200, gamma0: 200000.0, alpha: 1}   # Stage-2 LPIPS 0.4722 PSNR 24.23 at 8 images
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 640, lr: 0.3}   # Stage-2 LPIPS 0.3076 PSNR 23.78 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 40, lam: 1000, lr: 0.3}   # Stage-2 LPIPS 0.2117 PSNR 24.81 at 8 images

  random_inpainting__rhc:
    enabled: true
    problem: random_inpaint
    num_images: 100
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      sit:
        batch_size: 10
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 1, lam: 60, lr: 0.2}   # Stage-2 LPIPS 0.2457 PSNR 25.18 at 8 images

  random_inpainting__rhso:
    enabled: true
    problem: random_inpaint
    num_images: 100
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      sit:
        batch_size: 6
        methods:
          rhso:        {t0: 1.0, solver: heun, num_rhso_steps: 8, num_opt_steps: 80, lr: 0.03, mu: 0}   # Stage-2 LPIPS 0.2061 PSNR 24.99 at 8 images

  box_inpainting__core:
    enabled: true
    problem: box_inpaint
    num_images: 100
    degradation: {sigma: 0.05, box: 40}
    models:
      sit:
        batch_size: 16
        methods:
          sdedit:      {t0: 1.0, solver: heun, steps: 1}   # Stage-2 LPIPS 0.7143 PSNR 9.72 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 200, gamma0: 200000.0, alpha: 0.75}   # Stage-2 LPIPS 0.4675 PSNR 24.18 at 8 images
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 640, lr: 0.3}   # Stage-2 LPIPS 0.3022 PSNR 23.86 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 40, lam: 360, lr: 0.3}   # Stage-2 LPIPS 0.1942 PSNR 26.17 at 8 images

  box_inpainting__rhc:
    enabled: true
    problem: box_inpaint
    num_images: 100
    degradation: {sigma: 0.05, box: 40}
    models:
      sit:
        batch_size: 10
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 1, lam: 15, lr: 0.2}   # Stage-2 LPIPS 0.2525 PSNR 25.86 at 8 images

  box_inpainting__rhso:
    enabled: true
    problem: box_inpaint
    num_images: 100
    degradation: {sigma: 0.05, box: 40}
    models:
      sit:
        batch_size: 6
        methods:
          rhso:        {t0: 1.0, solver: heun, num_rhso_steps: 8, num_opt_steps: 80, lr: 0.03, mu: 0}   # Stage-2 LPIPS 0.2026 PSNR 25.83 at 8 images
