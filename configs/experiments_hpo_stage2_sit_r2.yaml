# Stage-2 follow-up round for sit (generated by scripts/hpo_stage2_round.py from outputs/stage2_sit):
# one step further out on every axis where the 8-image winner still sat on the edge of everything tried.
runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: true
  verbose: true
  max_atomic_jobs: 4000
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02

data:
  source: local_folder
  local_folder: "cache/data/imagenet_val_100"
  image_size: 256

models:
  sit: {}

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false

metrics:
  lpips: true
  lpips_net: alex

experiments:


  denoising__pnp__x1:
    enabled: true
    problem: denoising
    num_images: 8
    degradation: {sigma: 0.20}
    models:
      sit:
        batch_size: 4
        methods:
          pnp: {t0: 1.0, num_pnp_steps: 895, gamma0: 100000.0, alpha: 0.75}   # edge:num_pnp_steps+

  denoising__dflow__x1:
    enabled: true
    problem: denoising
    num_images: 8
    degradation: {sigma: 0.20}
    models:
      sit:
        batch_size: 4
        methods:
          dflow: {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 2560, lr: 0.3}   # edge:num_opt_steps+

  denoising__mpc_rhc__x1:
    enabled: true
    problem: denoising
    num_images: 8
    degradation: {sigma: 0.20}
    models:
      sit:
        batch_size: 4
        methods:
          mpc_rhc: {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 1, lam: 5, lr: 0.93}   # edge:lr+

  denoising__mpc_delta_t__x1:
    enabled: true
    problem: denoising
    num_images: 8
    degradation: {sigma: 0.20}
    models:
      sit:
        batch_size: 4
        methods:
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 160, lam: 180, lr: 0.3}   # edge:n_ctrl+

  denoising__rhso__x1:
    enabled: true
    problem: denoising
    num_images: 8
    degradation: {sigma: 0.20}
    models:
      sit:
        batch_size: 1
        methods:
          rhso: {t0: 1.0, solver: heun, num_rhso_steps: 8, num_opt_steps: 320, lr: 0.03, mu: 0}   # edge:num_opt_steps+

  deblurring__pnp__x1:
    enabled: true
    problem: deblur
    num_images: 8
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      sit:
        batch_size: 4
        methods:
          pnp: {t0: 1.0, num_pnp_steps: 895, gamma0: 100000.0, alpha: 0.5}   # edge:num_pnp_steps+

  deblurring__mpc_delta_t__x1:
    enabled: true
    problem: deblur
    num_images: 8
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      sit:
        batch_size: 4
        methods:
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 160, lam: 1000, lr: 0.3}   # edge:n_ctrl+

  deblurring__rhso__x1:
    enabled: true
    problem: deblur
    num_images: 8
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      sit:
        batch_size: 1
        methods:
          rhso: {t0: 1.0, solver: heun, num_rhso_steps: 8, num_opt_steps: 320, lr: 0.03, mu: 0}   # edge:num_opt_steps+

  super_resolution__pnp__x1:
    enabled: true
    problem: super_resolution
    num_images: 8
    degradation: {sigma: 0.05, factor: 2}
    models:
      sit:
        batch_size: 4
        methods:
          pnp: {t0: 1.0, num_pnp_steps: 895, gamma0: 100000.0, alpha: 0.5}   # edge:num_pnp_steps+

  super_resolution__dflow__x1:
    enabled: true
    problem: super_resolution
    num_images: 8
    degradation: {sigma: 0.05, factor: 2}
    models:
      sit:
        batch_size: 4
        methods:
          dflow: {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 2560, lr: 0.3}   # edge:num_opt_steps+

  super_resolution__mpc_rhc__x1:
    enabled: true
    problem: super_resolution
    num_images: 8
    degradation: {sigma: 0.05, factor: 2}
    models:
      sit:
        batch_size: 4
        methods:
          mpc_rhc: {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 1, lam: 3600, lr: 0.2}   # edge:lam+

  super_resolution__mpc_delta_t__x1:
    enabled: true
    problem: super_resolution
    num_images: 8
    degradation: {sigma: 0.05, factor: 2}
    models:
      sit:
        batch_size: 4
        methods:
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 4, n_ctrl: 160, lam: 1000, lr: 0.3}   # edge:n_ctrl+

  random_inpainting__pnp__x1:
    enabled: true
    problem: random_inpaint
    num_images: 8
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      sit:
        batch_size: 4
        methods:
          pnp: {t0: 1.0, num_pnp_steps: 895, gamma0: 200000.0, alpha: 1}   # edge:num_pnp_steps+

  random_inpainting__mpc_delta_t__x1:
    enabled: true
    problem: random_inpaint
    num_images: 8
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      sit:
        batch_size: 4
        methods:
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 4, n_ctrl: 160, lam: 540, lr: 0.3}   # edge:n_ctrl+

  box_inpainting__pnp__x1:
    enabled: true
    problem: box_inpaint
    num_images: 8
    degradation: {sigma: 0.05, box: 40}
    models:
      sit:
        batch_size: 4
        methods:
          pnp: {t0: 1.0, num_pnp_steps: 895, gamma0: 200000.0, alpha: 0.75}   # edge:num_pnp_steps+

  box_inpainting__dflow__x1:
    enabled: true
    problem: box_inpaint
    num_images: 8
    degradation: {sigma: 0.05, box: 40}
    models:
      sit:
        batch_size: 4
        methods:
          dflow: {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 2560, lr: 0.3}   # edge:num_opt_steps+

  box_inpainting__mpc_delta_t__x1:
    enabled: true
    problem: box_inpaint
    num_images: 8
    degradation: {sigma: 0.05, box: 40}
    models:
      sit:
        batch_size: 4
        methods:
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 160, lam: 360, lr: 0.3}   # edge:n_ctrl+

  box_inpainting__rhso__x1:
    enabled: true
    problem: box_inpaint
    num_images: 8
    degradation: {sigma: 0.05, box: 40}
    models:
      sit:
        batch_size: 1
        methods:
          rhso: {t0: 1.0, solver: heun, num_rhso_steps: 8, num_opt_steps: 320, lr: 0.03, mu: 0}   # edge:num_opt_steps+
