# =====================================================================================
# SiT / iMF hyperparameter sweep, round 2 -- denoising, 8 images
# =====================================================================================
#
# NOT the default configuration; configs/experiments.yaml is.  Run explicitly:
#   python run.py --config configs/experiments_sit_imf_hpo_v2.yaml --dry-run
#
# WHAT CHANGED FROM ROUND 1 (configs/experiments_sit_imf_hpo.yaml, 48 jobs, 4 images)
#   * 8 images instead of 4, so a difference of ~0.01 LPIPS starts to mean something.
#   * A much wider grid, and three axes round 1 never touched at all:
#       - phi_normalization   the fidelity SCALE.  Round 1 found PnP's gamma0 completely
#                             inert on iMF (identical LPIPS to four decimals across a 4x
#                             range).  The obvious suspect is that the data-fidelity term
#                             is scaled so small that no gamma0 matters, which is a
#                             NORMALISATION question, not a step-size one.  Swept here.
#       - alpha               PnP's other exponent, gamma_k = gamma0 * (1 - s_k)^alpha.
#       - n_ctrl / K          MPC's control dimension and horizon.
#   * lam is swept explicitly for both MPC methods rather than inherited from Table E.2.
#     Round 1 showed E.2's RHC value is roughly 5x too small; five values here bracket it.
#   * RHSO gets lr resolution around the 0.05 that won round 1, plus larger values, and
#     mu is retested at the lr where the method actually works.
#
# WHY THE TWO MODELS GET DIFFERENT GRIDS
#   Measured on this hardware, one iMF RHSO job at 8 images costs ~22 minutes; the same
#   SiT job costs ~2.  iMF's gradient path runs through the Flax SD-VAE decoder and that
#   is genuinely the work -- an allocator A/B test (platform vs BFC) came back 168.6 vs
#   170.4 s/image, i.e. no difference, so there is no cheap fix.  SiT therefore gets a
#   dense grid and iMF a coarser one on the same axes.  Best-per-model is still well
#   defined; what is NOT valid is reading the two grids as equally resolved.
#
# t0 is swept only where it is affordable (SDEdit, PnP, and D-Flow on SiT).  Round 1
# found PnP and SDEdit both prefer t0 = 0.6 while every measurement-driven method prefers
# 0.8, so the axis matters, but it multiplies everything it touches.
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true   # SiT is Torch and iMF is JAX; never co-resident
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: true
  verbose: true
  max_atomic_jobs: 400            # deliberately raised: this sweep is large by design
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02

data:
  # The run this was executed from used data.source: local_folder, because ILSVRC/imagenet-1k
  # is gated and that machine had no HF_TOKEN.  Committed as hf_imagenet_val so the file works
  # anywhere; each run's exact configuration is preserved in its own outputs/<run_id>/config.yaml.
  source: hf_imagenet_val         # hf_imagenet_val | local_folder
  local_folder: ""
  image_size: 256

models:
  sit:
    batch_size: 2                 # SiT-XL/2, SD-VAE latent 4x32x32, Torch, standard flow
  imf:
    batch_size: 2                 # iMF-B-2, SD-VAE latent 32x32x4, JAX, MeanFlow
    vae_decode_batch: 2           # the registry default (8) compiles a pmap decode XLA cannot
                                  # schedule below ~17.7 GiB; 2 matches batch_size

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: true

metrics:
  lpips: true
  lpips_net: alex

experiments:

  denoising_sweep:
    enabled: true
    problem: denoising
    num_images: 8
    notes: >
      Round-2 hyperparameter sweep for the two latent-space models.  Every axis here is one
      the repository records as repository_default_untuned, plus phi_normalization, which
      rescales the fidelity term itself and was never swept before.
    degradation:
      sigma: 0.20                 # degraded PSNR ~20.5 dB -- the line every method must beat

    models:
      # ---------------------------------------------------------------- SiT: dense grid
      sit:
        methods:
          sdedit:
            t0: [0.4, 0.6, 0.8]
            steps: [4, 8, 25]
            solver: [euler, heun]

          pnp:
            t0: [0.6, 0.8]
            num_pnp_steps: 20
            gamma0: [0.25, 0.5, 1.0, 2.0, 4.0]
            alpha: [0.5, 1.0, 2.0]
            phi_normalization: [half_mean_squared_per_measurement, half_sum_squared]

          dflow:
            t0: [0.6, 0.8]
            steps: [2, 4]
            solver: heun
            num_opt_steps: [10, 20, 40]
            lr: [0.01, 0.05, 0.1]

          rhso:
            t0: 0.8
            solver: heun
            num_rhso_steps: 4
            num_opt_steps: [10, 20]
            beta: [0.5, 1.0, 2.0]
            lr: [0.02, 0.05, 0.1]
            mu: [0.0, 0.05, 0.2]

          mpc_rhc:
            t0: 0.8
            num_mpc_steps: 4
            K: [1, 3]
            lam: [0.05, 0.1, 0.5, 1.0, 5.0]
            n_ctrl: 20

          mpc_delta_t:
            t0: 0.8
            num_mpc_steps: [4, 8]
            lam: [1.0, 5.0, 15.0, 30.0]
            n_ctrl: [20, 40]

      # ---------------------------------------------------------------- iMF: coarser grid
      imf:
        methods:
          sdedit:
            t0: [0.4, 0.6, 0.8]
            steps: [1, 2, 4]

          pnp:
            t0: [0.6, 0.8]
            num_pnp_steps: 20
            gamma0: [0.5, 2.0]
            alpha: [0.5, 1.0, 2.0]
            phi_normalization: [half_mean_squared_per_measurement, half_sum_squared]

          dflow:
            t0: 0.8
            steps: [1, 2]
            num_opt_steps: [10, 20, 40]
            lr: [0.01, 0.05, 0.1]

          rhso:
            t0: 0.8
            num_rhso_steps: 4
            num_opt_steps: 10
            beta: [0.5, 1.0, 2.0]
            lr: [0.02, 0.05, 0.1]
            mu: [0.0, 0.1]

          mpc_rhc:
            t0: 0.8
            num_mpc_steps: 2
            K: 1
            lam: [0.05, 0.1, 0.5, 1.0, 5.0]
            n_ctrl: 20

          mpc_delta_t:
            t0: 0.8
            num_mpc_steps: 2
            lam: [1.0, 5.0, 15.0, 30.0]
            n_ctrl: 20
