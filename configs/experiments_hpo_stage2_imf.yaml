# =====================================================================================
# STAGE 2 -- confirm the Stage-1 survivors on 8 images
# =====================================================================================
#
#   python run.py --config configs/experiments_hpo_stage2_imf.yaml --run-id hpo_stage2 --no-figures
#
# Generated by hpo_stage2.py from outputs/hpo_imf.  Per cell: the top 3 of the 4-image screen, the
# manuscript's configuration where the cell has one, and one step beyond the grid edge on
# every axis where the winner sat on the edge.  `why` in each experiment name records which.
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: true
  verbose: true
  max_atomic_jobs: 4000
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02

data:
  source: local_folder
  local_folder: "cache/data/imagenet_val_100"
  image_size: 256

models:
  jit:
    variant: JiT-B/16
  pmf: {}
  sit: {}
  imf: {}

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false

metrics:
  lpips: true
  lpips_net: alex

experiments:


  denoising__sdedit__c1:
    enabled: true
    problem: denoising
    num_images: 8
    degradation: {sigma: 0.20}
    models:
      imf:
        batch_size: 2
        methods:
          sdedit:      {t0: 1.0, steps: 8}   # top1

  denoising__sdedit__c2:
