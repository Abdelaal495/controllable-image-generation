# =====================================================================================
# 8-image main-paper refinement sweep — TIME-BOUNDED (<10h target)
# =====================================================================================
# Fixed main-paper operating point:
#   t0=1.0 (pure noise), beta=1.0 (uniform), num_images=8, batch_size=4.
# JiT and pMF use exactly the same structural/compute budgets.
#
# This revision prunes combinations already well resolved by the 2-image mega sweep
# and keeps only targeted boundary probes for the remaining loose ends. In particular:
#   * MPC-delta_t: focused calibration at N=4 + tiny N=8 probe (N=2 dropped; lr=.05 retained only for deblur).
#   * MPC-RHC: N=4 and task-specific K frozen from the cross-model-consistent result.
#   * PnP: shared task-specific N narrowed; alpha/gamma boundary calibration retained.
#   * D-Flow: M=320 step/lr refinement + small M=640 probe at steps 2/4 only.
#   * RHSO: N=4, direct M={20,40} and lr={.01,.02,.03} boundary test.
#   * SDEdit: cheap shared [1,2,4,8] step curve.
#
# The goal is to finish comfortably overnight while leaving enough 8-image evidence
# to freeze final configurations tomorrow.
# Dry-run validated workload: 596 atomic jobs / 4,768 reconstructions;
# JIT=298, PMF=298. Batched model calls/backprops are close to the previous
# successful mega run, providing substantial margin versus the original 1,446-job draft.
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: auto
  continue_on_experiment_error: true
  progress_bars: true
  save_individual_images: false
  verbose: true
  max_atomic_jobs: 4096
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02
data:
  source: hf_imagenet_val
  local_folder: ''
  image_size: 256
models:
  jit:
    variant: JiT-B/16
    batch_size: 4
  pmf:
    batch_size: 4
defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false
metrics:
  lpips: true
  lpips_net: alex
experiments:
  denoising_refinement:
    enabled: true
    problem: denoising
    num_images: 8
    degradation:
      sigma: 0.2
    defaults:
      t0: 1.0
      beta: 1.0
    notes: Eight-image time-bounded main-paper refinement; pure noise and uniform schedule; shared structural
      budgets.
    models:
      jit:
        methods:
          sdedit:
            steps:
            - 1
            - 2
            - 4
            - 8
            solver: heun
          mpc_delta_t:
            num_mpc_steps: 4
            n_ctrl:
            - 20
            - 40
            lr:
            - 0.1
            - 0.15
            lam:
            - 15.0
            - 20.0
            - 30.0
          mpc_rhc:
            num_mpc_steps: 4
            K: 2
            n_ctrl:
            - 20
            - 40
            lr:
            - 0.05
            - 0.1
            lam:
            - 10.0
            - 15.0
            - 30.0
          pnp:
            num_pnp_steps: 50
            gamma0:
            - 200000.0
            - 400000.0
            - 800000.0
            - 1200000.0
            alpha:
            - 0.25
            - 0.5
            - 0.75
            noise_samples: 1
          dflow:
            steps:
            - 1
            - 2
            - 4
            num_opt_steps: 320
            lr:
            - 0.02
            - 0.03
            optimizer: adam
            solver: heun
          rhso:
