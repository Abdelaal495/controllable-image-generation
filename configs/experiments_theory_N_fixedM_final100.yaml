# =====================================================================================
# CAPACITY-MATCHED RHSO STAGE-COUNT SWEEP -- FIXED PER-STAGE OPTIMISER BUDGET  M = 40
# =====================================================================================
# Generated by scripts/make_theory_N_configs.py.  B = 40 N grows from 40 to 640 (deliberately unmatched): does replanning help when nothing is taken away?
#
# Pairs: pMF-L/16 vs JiT-L/16 (pixel), iMF-XL/2 vs SiT-XL/2 (latent).  RHSO only, direct
# terminal planning (one clean-state prediction per objective for both families), t0 = 1,
# beta = 1, 100 frozen images, seed 42.  lr and mu per task are the frozen-100 benchmark
# winners (docs/best_hyperparameters.md) and are NOT retuned per N or per model size; SiT and
# iMF-B values are reused for SiT-XL/2 and iMF-XL/2.
#
#   python run.py --config configs/experiments_theory_N_fixedM_final100.yaml --dry-run
#   python run.py --config configs/experiments_theory_N_fixedM_final100.yaml --models pmf --run-id theory_fixedM_pmf --no-figures
#
# Expected scale: 5 tasks x 5 N values x 4 models = 100 atomic jobs.
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: auto
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: false
  verbose: true
  max_atomic_jobs: 256
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02

data:
  # The SAME frozen ImageNet-100 benchmark the final paper configuration uses
  # (class seed 42, image seed 43). Point `local_folder` at your copy.
  source: local_folder
  local_folder: /home/abdelaal/controllable-image-generation-benchmarks/imagenet100_c42_i43
  image_size: 256

models:
  pmf:
    batch_size: 10
  jit:
    variant: JiT-L/16
    batch_size: 4
  imf:
    display_name: iMF-XL/2
    ckpt_file: iMF-XL-2.zip
    model_str: imfDiT_XL_2
    guidance: {scale: 8.0, interval: [0.42, 0.62], mode: null}   # the repository's recommendation for iMF-XL/2
    batch_size: 2
  sit:
    batch_size: 6

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false

metrics:
  lpips: true
  lpips_net: alex

experiments:


  denoising_M40_N1:
    enabled: true
    problem: denoising
    num_images: 100
    degradation: {sigma: 0.2}
    defaults: {t0: 1.0, beta: 1.0}
    models:
      pmf:
        methods:
          rhso: {num_rhso_steps: 1, num_opt_steps: 40, lr: 0.03, mu: 1, optimizer: adam, rhso_terminal_mode: direct,
                  rhso_stage_diagnostics: true, rhso_consistency_diagnostics: true, rhso_jacobian_diagnostics: false}
      jit:
        methods:
          rhso: {num_rhso_steps: 1, num_opt_steps: 40, lr: 0.005, mu: 0.2, optimizer: adam, solver: heun, rhso_terminal_mode: direct,
                  rhso_stage_diagnostics: true, rhso_consistency_diagnostics: true, rhso_jacobian_diagnostics: false}
      imf:
        methods:
          rhso: {num_rhso_steps: 1, num_opt_steps: 40, lr: 0.03, mu: 0, optimizer: adam, rhso_terminal_mode: direct,
                  rhso_stage_diagnostics: true, rhso_consistency_diagnostics: true, rhso_jacobian_diagnostics: false}
      sit:
        methods:
          rhso: {num_rhso_steps: 1, num_opt_steps: 40, lr: 0.03, mu: 0, optimizer: adam, solver: heun, rhso_terminal_mode: direct,
                  rhso_stage_diagnostics: true, rhso_consistency_diagnostics: true, rhso_jacobian_diagnostics: false}

