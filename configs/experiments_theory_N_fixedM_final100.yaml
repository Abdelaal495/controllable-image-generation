# EXPERIMENT 2B -- LARGER N AT A FIXED PER-STAGE OPTIMISER BUDGET  M = 40
#
# SCIENTIFIC QUESTION
# -------------------
# 2A confounds two effects: as N grows at fixed B, each stage gets FEWER optimizer
# iterations. This configuration removes that confound by holding M = 40 -- the validated
# main setting's per-stage budget -- and letting the TOTAL budget grow, B = 40N. If quality
# keeps improving here while it saturates or degrades in 2A, the 2A behaviour is optimiser
# starvation rather than a property of replanning itself.
#
# The two experiments are complementary and only meaningful read together:
#     2A  fixed B, M shrinks   -> "is replanning worth the iterations it costs?"
#     2B  fixed M, B grows     -> "does replanning help when nothing is taken away?"
#
# HELD FIXED  : M = 40, t0 = 1.0, beta = 1.0, direct terminal planning, 100 frozen images,
#               seed 42, the task-specific learning rate and mu of the tuned runs, which
#               are retuned neither per N nor per model size.
# SWEPT       : N in {1, 2, 4, 8, 16}, and the model.
# BUDGET      : DELIBERATELY UNMATCHED -- B = 40N runs from 40 to 640. Rows from this file
#               must never be placed in a matched-budget table without saying so.
# DIAGNOSTICS : stage + consistency only.
#
# COST WARNING. This is the most expensive of the six configurations: the N = 16 jobs cost
# 640 optimizer iterations per image, four times the main setting, and the whole file is
# roughly 1240/160 ~ 7.75x one matched-budget task-model column. It is run at the full 100
# images deliberately, as requested; if a shorter turnaround is needed, submit it as a job
# array (`bash submit.sh --config ... --array 8`) rather than quietly reducing num_images,
# which would break comparability with every other file in this suite.
#
# CAPACITY-MATCHED MODELS
# -----------------------
# Two pairs of comparable size, so a MeanFlow-vs-standard-flow gap cannot be read as a
# capacity gap: pMF-L/16 (410 M) against JiT-L/16 (459 M) in pixel space, and iMF-XL/2
# (610 M) against SiT-XL/2 (675 M) in latent space.
#
# Expected scale: 5 tasks x 5 N values x 4 models = 100 atomic jobs.
# Verify with: python run.py --config configs/experiments_theory_N_fixedM_final100.yaml --dry-run

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: auto
  continue_on_experiment_error: true
  progress_bars: true
  save_individual_images: false
  verbose: true
  max_atomic_jobs: 256
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02

data:
  # The SAME frozen ImageNet-100 benchmark the final paper configuration uses
  # (class seed 42, image seed 43). Point `local_folder` at your copy.
  source: local_folder
  local_folder: /home/abdelaal/controllable-image-generation-benchmarks/imagenet100_c42_i43
  image_size: 256

models:
  jit:
    variant: JiT-L/16
    batch_size: 4
  pmf:
    batch_size: 10
  sit:
    batch_size: 6
  imf:
    display_name: iMF-XL/2
    ckpt_file: iMF-XL-2.zip
    model_str: imfDiT_XL_2
    guidance: {scale: 8.0, interval: [0.42, 0.62], mode: null}
    batch_size: 2

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false

metrics:
  lpips: true
  lpips_net: alex

