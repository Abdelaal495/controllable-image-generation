# =====================================================================================
# RHSO TRAJECTORY FIGURE -- one run per inpainting problem, traced stage by stage
# =====================================================================================
#
#   python scripts/make_paper_figures.py --figure trajectory --problem box_inpaint --collect
#
# Eight images, pMF only, at the final-benchmark RHSO settings of each cell.
# `num_rhso_steps` is swept 4 / 6 / 8 only to choose the number of panels (N intervals
# give N + 1 states).  The trace is `src.rhso.TRACE`, installed by the figure script; a
# benchmark run leaves it None and is unaffected.
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: false
  continue_on_experiment_error: false
  progress_bars: false
  save_individual_images: true
  resume: false
  replicate: 0
  verbose: true
  gpu_memory_profiling: false

data:
  source: local_folder
  local_folder: "cache/data/imagenet100_c42_i43_mirror"
  image_size: 256

models:
  pmf:
    batch_size: 8

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: true

metrics:
  lpips: true
  lpips_net: alex

experiments:

  box_inpainting:
    enabled: true
    problem: box_inpaint
    num_images: 8
    degradation: {sigma: 0.05, box: 40}
    models:
      pmf:
        methods:
          rhso: {t0: 1.0, num_rhso_steps: [4, 6, 8], num_opt_steps: 40, lr: 0.01, mu: 0.0}

  random_inpainting:
    enabled: true
    problem: random_inpaint
    num_images: 8
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      pmf:
        methods:
          rhso: {t0: 1.0, num_rhso_steps: [4, 6, 8], num_opt_steps: 40, lr: 0.01, mu: 0.2}
