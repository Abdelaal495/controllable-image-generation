        methods:
          rhso:        {t0: 1.0, num_rhso_steps: [2, 8], num_opt_steps: [20, 80],
                        lr: [0.01, 0.03], mu: 0.0}

  random_inpainting__sdedit:
    enabled: true
    problem: random_inpaint
    num_images: 4
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      imf:
        batch_size: 2
