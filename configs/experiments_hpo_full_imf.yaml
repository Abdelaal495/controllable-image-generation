# =====================================================================================
# STAGE 1 -- iMF screening grid, for the OTHER machine
# =====================================================================================
#
#   python scripts/build_local_imagenet_pool.py --num-classes 100 --seed 0    # once, same pool
#   python run.py --config configs/experiments_hpo_full_imf.yaml --run-id hpo_full_imf --no-figures
#
# The iMF quarter of configs/experiments_hpo_full.yaml: the same grids, the same five tasks,
# the same four screening images, so its winners are selected by the same rule as the other
# three models'.  Split out only because of cost -- iMF's six methods run ~764 s/image
# against pMF's 85, so this file was ~300 GPU-hours before the device-placement fix in
# src/models/imf.py (the VAE decoder ran on the CPU inside every gradient step); with it,
# PnP measures 2.6 s/image (was 80) and RHSO 35 (was 167), so budget ~40-45 GPU-hours --
# iMF is now, like pMF, bound by the un-jitted outer objective trace, not by the decode.  Merge its results with
# `--aggregate` afterwards.
#
# RUNS ALONGSIDE the main sweep on one 24 GiB card (started 2026-09-06 while hpo_full was at
# 1260/6010): launch with XLA_PYTHON_CLIENT_MEM_FRACTION=0.40 so JAX can never take more
# than ~9.8 GiB (iMF peaks 7.6-9.2 GiB at batch 2), which leaves >=14.7 GiB for the main
# run whose worst measured job is 13.0 GiB (pMF MPC-RHC K=3 at batch 2).  Both processes
# are host-bound on a single thread, so sharing the GPU costs each little and roughly doubles
# total throughput.  If either log shows an OOM, a `resume: true` pass re-runs only the jobs
# that did not finish with status ok.
#
# batch_size stays at 2.  The binding constraint for iMF is HOST memory, not the device:
# batch 8 peaked at 1.3 GiB on the GPU and sawtoothed to 55 GiB of RSS on a 62 GiB box and
# was OOM-killed.  Check `ps -o rss` before raising it.
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: false
  verbose: true
  max_atomic_jobs: 8000
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02

data:
  source: local_folder
  local_folder: "cache/data/imagenet_val_100"
  image_size: 256

models:
  imf: {}

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false

metrics:
  lpips: true
  lpips_net: alex

experiments:


  denoising__sdedit:
    enabled: true
    problem: denoising
    num_images: 4
    degradation: {sigma: 0.20}
    models:
      imf:
        batch_size: 2
        methods:
          sdedit:      {t0: 1.0, steps: [1, 2, 4, 8]}

  denoising__pnp:
    enabled: true
    problem: denoising
    num_images: 4
    degradation: {sigma: 0.20}
    models:
      imf:
        batch_size: 2
        methods:
          pnp:         {t0: 1.0, num_pnp_steps: [10, 20, 50, 100, 200],
                        gamma0: [25000.0, 100000.0, 200000.0, 400000.0, 800000.0, 1200000.0, 5000000.0],
                        alpha: [0.1, 0.25, 0.5, 0.75, 1.0]}

  denoising__dflow:
    enabled: true
    problem: denoising
    num_images: 4
    degradation: {sigma: 0.20}
    models:
      imf:
        batch_size: 2
        methods:
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: [160, 320, 640],
                        lr: [0.003, 0.01, 0.03, 0.1, 0.3]}

  denoising__mpc_rhc:
    enabled: true
    problem: denoising
    num_images: 4
    degradation: {sigma: 0.20}
    models:
      imf:
        batch_size: 2
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, K: [1, 2, 3], n_ctrl: 40,
                        lam: [5.0, 15.0, 30.0, 60.0, 180.0, 240.0, 720.0], lr: [0.02, 0.05, 0.1, 0.2]}

  denoising__mpc_delta_t:
    enabled: true
    problem: denoising
    num_images: 4
    degradation: {sigma: 0.20}
    models:
      imf:
        batch_size: 2
        methods:
          mpc_delta_t: {t0: 1.0, num_mpc_steps: [4, 8], n_ctrl: [20, 40],
                        lam: [10.0, 30.0, 180.0, 360.0, 540.0, 1000.0], lr: [0.05, 0.1, 0.15, 0.3]}

  denoising__rhso:
    enabled: true
    problem: denoising
    num_images: 4
    degradation: {sigma: 0.20}
    models:
      imf:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 40,
                        lr: [0.005, 0.01, 0.02, 0.03, 0.05, 0.1], mu: [0.0, 0.2, 1.0]}

  denoising__rhso_budget:
    enabled: true
    problem: denoising
    num_images: 4
    degradation: {sigma: 0.20}
    models:
      imf:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: [2, 8], num_opt_steps: [20, 80],
                        lr: [0.01, 0.03], mu: 0.0}

  deblurring__sdedit:
    enabled: true
    problem: deblur
    num_images: 4
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      imf:
        batch_size: 2
        methods:
          sdedit:      {t0: 1.0, steps: [1, 2, 4, 8]}

  deblurring__pnp:
    enabled: true
    problem: deblur
    num_images: 4
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      imf:
        batch_size: 2
        methods:
          pnp:         {t0: 1.0, num_pnp_steps: [10, 20, 50, 100, 200],
                        gamma0: [25000.0, 100000.0, 200000.0, 400000.0, 800000.0, 1200000.0, 5000000.0],
                        alpha: [0.1, 0.25, 0.5, 0.75, 1.0]}

  deblurring__dflow:
