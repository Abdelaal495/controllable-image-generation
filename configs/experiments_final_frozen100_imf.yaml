# =====================================================================================
# FINAL BENCHMARK at t0 = 1.0 on the paper's frozen ImageNet-100 (class seed 42 / image seed 43),
# model imf only -- one process per GPU.  Generated by scripts/make_final_frozen100_configs.py
# from outputs/stage2_imf, outputs/stage2_imf_r2, outputs/stage2_imf_r3, outputs/stage2_imf_r4, outputs/stage2_imf_r5: every entry is the lowest-LPIPS Stage-2 configuration of its cell (8 images), the
# trailing comment is that Stage-2 score.  Layout as configs/experiments_t1_final.yaml
# (__core / __rhc / __rhso split by memory class; batch_size resolves per (experiment, model)).
#
#   python run.py --config configs/experiments_final_frozen100_imf.yaml --dry-run
#   CUDA_VISIBLE_DEVICES=<k> python -u run.py --config configs/experiments_final_frozen100_imf.yaml --run-id final_imf --no-figures
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: true
  verbose: true
  max_atomic_jobs: 200
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02

data:
  # Built by: python build_local_imagenet_pool.py --frozen-manifest benchmarks/imagenet100_c42_i43/manifest.csv
  source: local_folder
  local_folder: "cache/data/imagenet100_c42_i43_mirror"
  image_size: 256

models:
  imf: {}

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false

metrics:
  lpips: true
  lpips_net: alex

experiments:


  denoising__core:
    enabled: true
    problem: denoising
    num_images: 100
    degradation: {sigma: 0.20}
    models:
      imf:
        batch_size: 10
        methods:
          sdedit:      {t0: 1.0, steps: 8}   # Stage-2 LPIPS 0.7558 PSNR 9.75 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 4004, gamma0: 100000.0, alpha: 1}   # Stage-2 LPIPS 0.2249 PSNR 26.43 at 8 images
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 5120, lr: 0.3}   # Stage-2 LPIPS 0.2490 PSNR 26.07 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 80, lam: 540, lr: 0.3}   # Stage-2 LPIPS 0.2196 PSNR 26.40 at 8 images

  denoising__rhc:
    enabled: true
    problem: denoising
    num_images: 100
    degradation: {sigma: 0.20}
    models:
      imf:
        batch_size: 10
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 1, lam: 15, lr: 0.2}   # Stage-2 LPIPS 0.2651 PSNR 26.03 at 8 images

  denoising__rhso:
    enabled: true
    problem: denoising
    num_images: 100
    degradation: {sigma: 0.20}
    models:
      imf:
        batch_size: 10
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 8, num_opt_steps: 160, lr: 0.03, mu: 0}   # Stage-2 LPIPS 0.2131 PSNR 26.27 at 8 images

  deblurring__core:
    enabled: true
    problem: deblur
    num_images: 100
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      imf:
        batch_size: 10
        methods:
          sdedit:      {t0: 1.0, steps: 8}   # Stage-2 LPIPS 0.7558 PSNR 9.75 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 4004, gamma0: 100000.0, alpha: 1}   # Stage-2 LPIPS 0.2866 PSNR 25.47 at 8 images
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 5120, lr: 0.3}   # Stage-2 LPIPS 0.2776 PSNR 26.17 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 320, lam: 1000, lr: 0.3}   # Stage-2 LPIPS 0.2335 PSNR 26.04 at 8 images

  deblurring__rhc:
    enabled: true
    problem: deblur
    num_images: 100
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      imf:
        batch_size: 10
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 1, lam: 180, lr: 0.2}   # Stage-2 LPIPS 0.3011 PSNR 25.85 at 8 images

  deblurring__rhso:
    enabled: true
    problem: deblur
    num_images: 100
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      imf:
        batch_size: 10
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 16, num_opt_steps: 80, lr: 0.03, mu: 0}   # Stage-2 LPIPS 0.2279 PSNR 26.16 at 8 images

  super_resolution__core:
    enabled: true
    problem: super_resolution
    num_images: 100
    degradation: {sigma: 0.05, factor: 2}
    models:
      imf:
        batch_size: 10
        methods:
          sdedit:      {t0: 1.0, steps: 8}   # Stage-2 LPIPS 0.7558 PSNR 9.75 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 8468, gamma0: 100000.0, alpha: 1}   # Stage-2 LPIPS 0.1999 PSNR 25.46 at 8 images
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 5120, lr: 0.3}   # Stage-2 LPIPS 0.2535 PSNR 24.28 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 40, lam: 2500, lr: 0.3}   # Stage-2 LPIPS 0.2206 PSNR 25.11 at 8 images

  super_resolution__rhc:
    enabled: true
    problem: super_resolution
    num_images: 100
    degradation: {sigma: 0.05, factor: 2}
    models:
      imf:
        batch_size: 10
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 1, lam: 240, lr: 0.2}   # Stage-2 LPIPS 0.2412 PSNR 25.60 at 8 images

  super_resolution__rhso:
    enabled: true
    problem: super_resolution
    num_images: 100
    degradation: {sigma: 0.05, factor: 2}
    models:
      imf:
        batch_size: 10
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 16, num_opt_steps: 80, lr: 0.03, mu: 0}   # Stage-2 LPIPS 0.2351 PSNR 24.37 at 8 images

  random_inpainting__core:
    enabled: true
    problem: random_inpaint
    num_images: 100
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      imf:
        batch_size: 10
        methods:
          sdedit:      {t0: 1.0, steps: 8}   # Stage-2 LPIPS 0.7558 PSNR 9.75 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 4004, gamma0: 100000.0, alpha: 1}   # Stage-2 LPIPS 0.2341 PSNR 25.42 at 8 images
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 5120, lr: 0.3}   # Stage-2 LPIPS 0.2493 PSNR 24.51 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 160, lam: 1000, lr: 0.3}   # Stage-2 LPIPS 0.2125 PSNR 24.95 at 8 images

  random_inpainting__rhc:
    enabled: true
    problem: random_inpaint
    num_images: 100
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      imf:
        batch_size: 10
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 1, lam: 180, lr: 0.2}   # Stage-2 LPIPS 0.2587 PSNR 25.27 at 8 images

  random_inpainting__rhso:
    enabled: true
    problem: random_inpaint
    num_images: 100
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      imf:
        batch_size: 10
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 8, num_opt_steps: 640, lr: 0.03, mu: 0}   # Stage-2 LPIPS 0.1969 PSNR 24.67 at 8 images

  box_inpainting__core:
    enabled: true
    problem: box_inpaint
    num_images: 100
    degradation: {sigma: 0.05, box: 40}
    models:
      imf:
        batch_size: 10
        methods:
          sdedit:      {t0: 1.0, steps: 8}   # Stage-2 LPIPS 0.7558 PSNR 9.75 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 4004, gamma0: 100000.0, alpha: 1}   # Stage-2 LPIPS 0.2527 PSNR 25.89 at 8 images
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 5120, lr: 0.3}   # Stage-2 LPIPS 0.2142 PSNR 25.88 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 320, lam: 1000, lr: 0.3}   # Stage-2 LPIPS 0.1932 PSNR 25.83 at 8 images

  box_inpainting__rhc:
    enabled: true
    problem: box_inpaint
    num_images: 100
    degradation: {sigma: 0.05, box: 40}
    models:
      imf:
        batch_size: 10
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 1, lam: 60, lr: 0.2}   # Stage-2 LPIPS 0.2498 PSNR 26.25 at 8 images

  box_inpainting__rhso:
    enabled: true
    problem: box_inpaint
    num_images: 100
    degradation: {sigma: 0.05, box: 40}
    models:
      imf:
        batch_size: 10
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 32, num_opt_steps: 80, lr: 0.03, mu: 0}   # Stage-2 LPIPS 0.1947 PSNR 26.25 at 8 images
