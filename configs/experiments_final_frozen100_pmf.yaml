# =====================================================================================
# FINAL BENCHMARK at t0 = 1.0 on the paper's frozen ImageNet-100 (class seed 42 / image seed 43),
# model pmf only -- one process per GPU.  Generated by scripts/make_final_frozen100_configs.py
# from outputs/stage2_pmf: every entry is the lowest-LPIPS Stage-2 configuration of its cell (8 images) RESTRICTED TO THE STAGE-1 GRID (edge extensions excluded), the
# trailing comment is that Stage-2 score.  Layout as configs/experiments_t1_final.yaml
# (__core / __rhc / __rhso split by memory class; batch_size resolves per (experiment, model)).
#
#   python run.py --config configs/experiments_final_frozen100_pmf.yaml --dry-run
#   CUDA_VISIBLE_DEVICES=<k> python -u run.py --config configs/experiments_final_frozen100_pmf.yaml --run-id final_pmf --no-figures
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: true
  verbose: true
  max_atomic_jobs: 200
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02

data:
  # Built by: python build_local_imagenet_pool.py --frozen-manifest benchmarks/imagenet100_c42_i43/manifest.csv
  source: local_folder
  local_folder: "cache/data/imagenet100_c42_i43_mirror"
  image_size: 256

models:
  pmf: {}

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false

metrics:
  lpips: true
  lpips_net: alex

experiments:


  denoising__core:
    enabled: true
    problem: denoising
    num_images: 100
    degradation: {sigma: 0.20}
    models:
      pmf:
        batch_size: 10
        methods:
          sdedit:      {t0: 1.0, steps: 2}   # Stage-2 LPIPS 0.7136 PSNR 9.35 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 10, gamma0: 200000.0, alpha: 0.1}   # Stage-2 LPIPS 0.0787 PSNR 27.31 at 8 images
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 320, lr: 0.1}   # Stage-2 LPIPS 0.2101 PSNR 26.34 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 20, lam: 30, lr: 0.15}   # Stage-2 LPIPS 0.1670 PSNR 27.38 at 8 images

  denoising__rhc:
    enabled: true
    problem: denoising
    num_images: 100
    degradation: {sigma: 0.20}
    models:
      pmf:
        batch_size: 5
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 2, lam: 30, lr: 0.1}   # Stage-2 LPIPS 0.1052 PSNR 28.18 at 8 images

  denoising__rhso:
    enabled: true
    problem: denoising
    num_images: 100
    degradation: {sigma: 0.20}
    models:
      pmf:
        batch_size: 10
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.03, mu: 1}   # Stage-2 LPIPS 0.0905 PSNR 28.32 at 8 images

  deblurring__core:
    enabled: true
    problem: deblur
    num_images: 100
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      pmf:
        batch_size: 10
        methods:
          sdedit:      {t0: 1.0, steps: 2}   # Stage-2 LPIPS 0.7136 PSNR 9.35 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 200, gamma0: 5000000.0, alpha: 1}   # Stage-2 LPIPS 0.1389 PSNR 27.33 at 8 images
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 640, lr: 0.03}   # Stage-2 LPIPS 0.2901 PSNR 24.82 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 40, lam: 1000, lr: 0.1}   # Stage-2 LPIPS 0.1352 PSNR 28.62 at 8 images

  deblurring__rhc:
    enabled: true
    problem: deblur
    num_images: 100
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      pmf:
        batch_size: 5
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 1, lam: 60, lr: 0.2}   # Stage-2 LPIPS 0.1524 PSNR 28.09 at 8 images

  deblurring__rhso:
    enabled: true
    problem: deblur
    num_images: 100
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      pmf:
        batch_size: 10
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 8, num_opt_steps: 20, lr: 0.01, mu: 0}   # Stage-2 LPIPS 0.1211 PSNR 29.00 at 8 images

  super_resolution__core:
    enabled: true
    problem: super_resolution
    num_images: 100
    degradation: {sigma: 0.05, factor: 2}
    models:
      pmf:
        batch_size: 10
        methods:
          sdedit:      {t0: 1.0, steps: 2}   # Stage-2 LPIPS 0.7136 PSNR 9.35 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 20, gamma0: 100000.0, alpha: 0.1}   # Stage-2 LPIPS 0.1286 PSNR 25.24 at 8 images
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 640, lr: 0.03}   # Stage-2 LPIPS 0.1891 PSNR 25.56 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 40, lam: 360, lr: 0.15}   # Stage-2 LPIPS 0.0938 PSNR 26.52 at 8 images

  super_resolution__rhc:
    enabled: true
    problem: super_resolution
    num_images: 100
    degradation: {sigma: 0.05, factor: 2}
    models:
      pmf:
        batch_size: 5
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 3, lam: 180, lr: 0.05}   # Stage-2 LPIPS 0.2027 PSNR 25.20 at 8 images

  super_resolution__rhso:
    enabled: true
    problem: super_resolution
    num_images: 100
    degradation: {sigma: 0.05, factor: 2}
    models:
      pmf:
        batch_size: 10
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.01, mu: 0.2}   # Stage-2 LPIPS 0.1072 PSNR 26.66 at 8 images

  random_inpainting__core:
    enabled: true
    problem: random_inpaint
    num_images: 100
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      pmf:
        batch_size: 10
        methods:
          sdedit:      {t0: 1.0, steps: 2}   # Stage-2 LPIPS 0.7136 PSNR 9.35 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 20, gamma0: 100000.0, alpha: 0.1}   # Stage-2 LPIPS 0.1221 PSNR 25.23 at 8 images
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 640, lr: 0.03}   # Stage-2 LPIPS 0.2955 PSNR 24.44 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 40, lam: 360, lr: 0.15}   # Stage-2 LPIPS 0.0878 PSNR 26.95 at 8 images

  random_inpainting__rhc:
    enabled: true
    problem: random_inpaint
    num_images: 100
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      pmf:
        batch_size: 5
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 3, lam: 180, lr: 0.05}   # Stage-2 LPIPS 0.2217 PSNR 24.92 at 8 images

  random_inpainting__rhso:
    enabled: true
    problem: random_inpaint
    num_images: 100
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      pmf:
        batch_size: 10
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.01, mu: 0}   # Stage-2 LPIPS 0.1026 PSNR 26.80 at 8 images

  box_inpainting__core:
    enabled: true
    problem: box_inpaint
    num_images: 100
    degradation: {sigma: 0.05, box: 40}
    models:
      pmf:
        batch_size: 10
        methods:
          sdedit:      {t0: 1.0, steps: 2}   # Stage-2 LPIPS 0.7136 PSNR 9.35 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 50, gamma0: 200000.0, alpha: 0.1}   # Stage-2 LPIPS 0.0449 PSNR 29.63 at 8 images
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 640, lr: 0.1}   # Stage-2 LPIPS 0.1406 PSNR 24.67 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 40, lam: 180, lr: 0.3}   # Stage-2 LPIPS 0.0457 PSNR 29.04 at 8 images

  box_inpainting__rhc:
    enabled: true
    problem: box_inpaint
    num_images: 100
    degradation: {sigma: 0.05, box: 40}
    models:
      pmf:
        batch_size: 5
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 1, lam: 30, lr: 0.05}   # Stage-2 LPIPS 0.0810 PSNR 25.65 at 8 images

  box_inpainting__rhso:
    enabled: true
    problem: box_inpaint
    num_images: 100
    degradation: {sigma: 0.05, box: 40}
    models:
      pmf:
        batch_size: 10
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 8, num_opt_steps: 20, lr: 0.01, mu: 0}   # Stage-2 LPIPS 0.0485 PSNR 29.44 at 8 images
