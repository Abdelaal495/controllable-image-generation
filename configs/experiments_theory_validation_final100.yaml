# THEORY-VALIDATION SUITE -- 100 images, batch 4, pMF-direct and JiT-direct.
#
# What this configuration tests
# -----------------------------
#   1. MATCHED BUDGET.  At a fixed total optimisation budget B = N*M = 160, does
#      distributing the optimisation across the trajectory beat concentrating it at the
#      initial, most ill-conditioned stage?  The ONLY (N, M) pairs are
#          (1, 160)  (2, 80)  (4, 40)  (8, 20)
#      Each pair is its own named experiment block. That is deliberate: N and M are
#      independent sweep axes, so writing them as two lists in one block would expand to
#      the 16-job Cartesian product instead of these 4 matched-budget points.
#   2. t0 ABLATION.  The same RHSO setting (N=4, M=40) started from t0 in {0.8, 0.6, 0.4}.
#      t0 = 1.0 is NOT repeated here: it is already the (4, 40) matched-budget job, and the
#      two would be the same job. Remember the repository convention
#      canonical_start_time = 1 - t0; both are recorded on every row.
#      Initialisation is the repository's existing shared rule, unchanged:
#      z_t0 = (1 - t0) g(y) + t0 eps at t0 < 1, and the prior noise itself at t0 = 1.
#   3. STAGE EFFICIENCY and REPLANNING CONSISTENCY diagnostics on every job.
#      Jacobian spectral diagnostics are deliberately OFF here -- they are expensive and
#      belong in configs/experiments_theory_jacobian_8img.yaml.
#
# Terminal planners (both are ONE prediction per inner objective, and they are NOT the
# same learned object):
#     pMF        T_theta(q; s_k -> 1)   a learned finite-interval transport map
#     JiT-direct x_hat_1(q, s_k)        a direct clean-endpoint prediction
# `solver: heun` on the JiT jobs governs the EXECUTED interval only, exactly as in the
# frozen benchmark; the terminal objective no longer integrates the remaining suffix.
#
# Learning rates are copied verbatim from configs/experiments_imagenet100_final.yaml and
# are NOT retuned per N. They are the frozen benchmark's RHSO values:
#                   JiT     pMF
#     denoising     0.01    0.03
#     deblurring    0.01    0.01
#     super-res     0.01    0.01
#     box inpaint   0.01    0.02
#     random inp.   0.01    0.01
#
# Expected scale:  matched budget  5 tasks x 2 models x 4 (N, M) pairs = 40 jobs
#                  t0 ablation     5 tasks x 2 models x 3 t0 values    = 30 jobs
#                  TOTAL                                               = 70 atomic jobs
# Verify with:  python run.py --config configs/experiments_theory_validation_final100.yaml --dry-run

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: auto
  continue_on_experiment_error: true
  progress_bars: true
  save_individual_images: false
  verbose: true
  max_atomic_jobs: 512
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02

data:
  # The SAME frozen ImageNet-100 benchmark the final paper configuration uses
  # (class seed 42, image seed 43). Point `local_folder` at your copy.
  source: local_folder
  local_folder: cache/data/imagenet100_c42_i43_mirror   # scripts/build_local_imagenet_pool.py --frozen-manifest benchmarks/imagenet100_c42_i43/manifest.csv
  image_size: 256

models:
  jit:
    variant: JiT-B/16
    # batch_size 4 for BOTH models. The optimisation objective is SUMMED over the batch, so
    # a sample's own gradient is unchanged by its batch companions; the memory and runtime
    # numbers below are therefore batch-4 JOB figures, not per-image ones.
    batch_size: 4
  pmf:
    batch_size: 4

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false

metrics:
  lpips: true
  lpips_net: alex

experiments:

  # ---------------- matched budget B = N*M = 160, t0 = 1.0 ----------------
  denoising_B160_N1:
    enabled: true
    problem: denoising
    num_images: 100
    degradation: {sigma: 0.2}
    defaults: {t0: 1.0, beta: 1.0}
    models:
      jit:
        methods:
          rhso: {num_rhso_steps: 1, num_opt_steps: 160, lr: 0.01, mu: 0.0, optimizer: adam, solver: heun, rhso_terminal_mode: direct,
                  rhso_stage_diagnostics: true, rhso_consistency_diagnostics: true, rhso_jacobian_diagnostics: false}
