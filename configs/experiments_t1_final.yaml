        batch_size: 8
        methods:
          sdedit:      {t0: 1.0, steps: 4, solver: heun}   # LPIPS 0.7232 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 100, gamma0: 100000.0, alpha: 0.5}   # LPIPS 0.5140 at 8 images
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 320, lr: 0.03}   # LPIPS 0.4915 at 8 images
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, lam: 540.0, n_ctrl: 40, lr: 0.1}   # LPIPS 0.2437 at 8 images
