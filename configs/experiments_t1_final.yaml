          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, lam: 180.0, n_ctrl: 40, lr: 0.1}   # LPIPS 0.0499 at 8 images

  box_inpainting__rhc:
    enabled: true
    problem: box_inpaint
    num_images: 100
    degradation: {sigma: 0.05, box: 40}
    models:
      jit:
        batch_size: 10
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, K: 1, lam: 60.0, n_ctrl: 40, lr: 0.05}   # LPIPS 0.0674 at 8 images
      sit:
