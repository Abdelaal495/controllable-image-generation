        methods:
          sdedit:      {t0: 1.0, steps: 4, solver: heun}   # LPIPS 0.7232 at 8 images
          pnp:         {t0: 1.0, num_pnp_steps: 100, gamma0: 100000.0, alpha: 0.5}   # LPIPS 0.5124 at 8 images
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 320, lr: 0.03}   # LPIPS 0.5375 at 8 images
