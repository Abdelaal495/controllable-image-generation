# =====================================================================================
# Mega tuning sweep — JiT vs pMF only
# =====================================================================================
# Purpose:
#   - broad 2-image validation sweep to identify robust hyperparameter patterns;
#   - keep algorithmic/structural budgets matched between JiT and pMF;
#   - tune scale-sensitive parameters on identical candidate grids;
#   - include targeted initialization (t0), beta-schedule, and RHSO-mu probes;
#   - exclude SiT, iMF, and stroke painting.
#
# Matched main-sweep structural grids:
#   SDEdit      : steps = 4
#   PnP-Flow    : N = [20, 50, 100], R = 1
#   D-Flow      : trajectory steps = [1, 2, 4], optimizer steps M = [80, 160, 320]
#   MPC-delta_t : outer N = [2, 4], control iterations C = [20, 40]
#   MPC-RHC     : outer N = [2, 4], K = [1, 2, 3], C = [20, 40]
#   RHSO        : outer N = [2, 4], inner M = [5, 10, 20]
#
# Resolved workload (validated with src.config):
#   2,210 atomic jobs = 4,420 image reconstructions
#   JiT: 1,105 jobs | pMF: 1,105 jobs
#   main tuning: 1,880 | initialization: 240 | beta: 70 | RHSO-mu: 20
#
# This deliberately uses only 2 validation images. The intended next step is to use the
# patterns from this sweep to make a much smaller confirmation sweep on more images.
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: auto
  continue_on_experiment_error: true
  progress_bars: true
  save_individual_images: false
  verbose: true
  max_atomic_jobs: 4096
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02
data:
  source: hf_imagenet_val
  local_folder: ''
  image_size: 256
models:
  jit:
    variant: JiT-B/16
    batch_size: 2
  pmf:
    batch_size: 2
defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false
metrics:
  lpips: true
  lpips_net: alex
