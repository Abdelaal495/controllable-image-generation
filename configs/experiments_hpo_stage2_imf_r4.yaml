# Stage-2 follow-up round for imf (generated by scripts/hpo_stage2_round.py from outputs/stage2_imf, outputs/stage2_imf_r2, outputs/stage2_imf_r3):
# one step further out on every axis where the 8-image winner still sat on the edge of everything tried.
runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: true
  verbose: true
  max_atomic_jobs: 4000
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02

data:
  source: local_folder
  local_folder: "cache/data/imagenet_val_100"
  image_size: 256

models:
  imf: {}

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false

metrics:
  lpips: true
  lpips_net: alex

# Round 4 pruned to the PnP axis only: D-Flow / n_ctrl / RHSO-M pushes were not significant on the last doubling (paired t, 8 images).
experiments:
  denoising__pnp__x1:
    enabled: true
    problem: denoising
    num_images: 8
    degradation: {sigma: 0.20}
    models:
      imf:
        batch_size: 2
        methods:
          pnp: {t0: 1.0, num_pnp_steps: 4004, gamma0: 100000.0, alpha: 1}   # edge:num_pnp_steps+

  deblurring__pnp__x1:
    enabled: true
    problem: deblur
    num_images: 8
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      imf:
        batch_size: 2
        methods:
          pnp: {t0: 1.0, num_pnp_steps: 4004, gamma0: 100000.0, alpha: 1}   # edge:num_pnp_steps+

  super_resolution__pnp__x1:
    enabled: true
    problem: super_resolution
    num_images: 8
    degradation: {sigma: 0.05, factor: 2}
    models:
      imf:
        batch_size: 2
        methods:
          pnp: {t0: 1.0, num_pnp_steps: 4004, gamma0: 100000.0, alpha: 1}   # edge:num_pnp_steps+

  random_inpainting__pnp__x1:
    enabled: true
    problem: random_inpaint
    num_images: 8
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      imf:
        batch_size: 2
        methods:
          pnp: {t0: 1.0, num_pnp_steps: 4004, gamma0: 100000.0, alpha: 1}   # edge:num_pnp_steps+

  box_inpainting__pnp__x1:
    enabled: true
    problem: box_inpaint
    num_images: 8
    degradation: {sigma: 0.05, box: 40}
    models:
      imf:
        batch_size: 2
        methods:
          pnp: {t0: 1.0, num_pnp_steps: 4004, gamma0: 100000.0, alpha: 1}   # edge:num_pnp_steps+

