# PER-MODEL SPLIT of configs/experiments_hpo_full.yaml (SIT only) for machines with several
# GPUs: run each model as its own process on its own card, never two on one card.  Merge
# the finished runs with --aggregate; scripts/hpo_stage2.py accepts several --run directories.
# =====================================================================================
# STAGE 1 -- per (model, task, method) screening grid at t0 = 1.0
# =====================================================================================
#
#   python run.py --config configs/experiments_hpo_full.yaml --run-id hpo_full --no-figures
#
# WHY THIS EXISTS.  The previous t0 = 1.0 sweep varied exactly ONE knob per method and
# froze the rest at model-level constants -- PnP at gamma0 = 1e5, alpha = 0.5; MPC-RHC at
# lam = 60; MPC-dt at lam = 180; RHSO at lr = 0.01.  Those constants were carried over from
# the t0 = 0.8 rounds, and gamma0 in particular had only ever been swept over {0.25, 0.5,
# 1.0} -- five orders of magnitude below the range that the per-measurement normalisation
# (which divides by 196,608) makes meaningful.  So not one of the manuscript's ten PnP
# configurations had ever been executed, and the lam values it reports span 15 to 540 where
# we used a single number per method.
#
# COVERAGE.  Every value in Tables 4-7 lies inside the grids below, and every axis extends
# at least one step BEYOND the manuscript's range on both sides -- lambda by 3x each way,
# lr by 2-2.5x, gamma0 by 4x, PnP's N by 2x -- so the manuscript's choices are a strict
# interior subset of what is searched, and a manuscript value that wins here wins against
# neighbours the manuscript never tried.  A first draft of this file had grids equal to the
# manuscript's value sets; that could confirm its choices but never improve on them.
#
# RHSO additionally probes the structural budget in `__rhso_budget`: (N, M) at the same
# N*M = 160 the manuscript fixes, and at double it.  Standard-flow RHSO memory grows with
# N (the first stage differentiates the whole remaining suffix), hence the smaller batches.
#
# Stage 2 then re-runs each cell's top three, the manuscript's value, and any winner on a
# grid edge on more images, extending that axis further.
#
# SCREEN SIZE.  Four images.  Measured against the eight-image t1_hpo run, a four-image
# screen keeps the same winner in 83% of cells and the true winner inside its top three in
# 98%, at a median cost of 0.0000 and a p90 of 0.0058 LPIPS.  That is fine for narrowing
# and not fine for deciding, which is why stage 2 re-runs the survivors on more images.
#
# 399 configurations per cell x 5 tasks x 3 models = ~6000 jobs, about 49 h.  iMF is absent:
# its six methods cost ~764 s/image against pMF's 85, so the same grid would take ~135 h
# here.  Generate it for the other machine from this file by adding the imf block.
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: false
  verbose: true
  max_atomic_jobs: 8000
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02

data:
  source: local_folder
  local_folder: "cache/data/imagenet_val_100"
  image_size: 256

models:
  sit: {}

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false

metrics:
  lpips: true
  lpips_net: alex

experiments:


  denoising__sdedit:
    enabled: true
    problem: denoising
    num_images: 4
    degradation: {sigma: 0.20}
    models:
      sit:
        batch_size: 4
        methods:
          sdedit:      {t0: 1.0, steps: [1, 2, 4, 8, 25], solver: heun}

  denoising__pnp:
    enabled: true
    problem: denoising
    num_images: 4
    degradation: {sigma: 0.20}
    models:
      sit:
        batch_size: 4
        methods:
          pnp:         {t0: 1.0, num_pnp_steps: [10, 20, 50, 100, 200],
                        gamma0: [25000.0, 100000.0, 200000.0, 400000.0, 800000.0, 1200000.0, 5000000.0],
                        alpha: [0.1, 0.25, 0.5, 0.75, 1.0]}

  denoising__dflow:
    enabled: true
    problem: denoising
    num_images: 4
    degradation: {sigma: 0.20}
    models:
      sit:
        batch_size: 4
        methods:
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: [160, 320, 640],
                        lr: [0.003, 0.01, 0.03, 0.1, 0.3]}

  denoising__mpc_rhc:
    enabled: true
    problem: denoising
    num_images: 4
    degradation: {sigma: 0.20}
    models:
      sit:
        batch_size: 4
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, K: [1, 2, 3], n_ctrl: 40,
                        lam: [5.0, 15.0, 30.0, 60.0, 180.0, 240.0, 720.0], lr: [0.02, 0.05, 0.1, 0.2]}

  denoising__mpc_delta_t:
    enabled: true
    problem: denoising
    num_images: 4
    degradation: {sigma: 0.20}
    models:
      sit:
        batch_size: 4
        methods:
          mpc_delta_t: {t0: 1.0, num_mpc_steps: [4, 8], n_ctrl: [20, 40],
                        lam: [10.0, 30.0, 180.0, 360.0, 540.0, 1000.0], lr: [0.05, 0.1, 0.15, 0.3]}

  denoising__rhso:
    enabled: true
    problem: denoising
    num_images: 4
    degradation: {sigma: 0.20}
    models:
      sit:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 40, solver: heun,
                        lr: [0.005, 0.01, 0.02, 0.03, 0.05, 0.1], mu: [0.0, 0.2, 1.0]}

  denoising__rhso_budget:
    enabled: true
    problem: denoising
    num_images: 4
    degradation: {sigma: 0.20}
    models:
      sit:
        batch_size: 1
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: [2, 8], num_opt_steps: [20, 80], solver: heun,
                        lr: [0.01, 0.03], mu: 0.0}

  deblurring__sdedit:
    enabled: true
    problem: deblur
    num_images: 4
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      sit:
        batch_size: 4
        methods:
          sdedit:      {t0: 1.0, steps: [1, 2, 4, 8, 25], solver: heun}

  deblurring__pnp:
    enabled: true
    problem: deblur
    num_images: 4
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      sit:
        batch_size: 4
        methods:
          pnp:         {t0: 1.0, num_pnp_steps: [10, 20, 50, 100, 200],
                        gamma0: [25000.0, 100000.0, 200000.0, 400000.0, 800000.0, 1200000.0, 5000000.0],
                        alpha: [0.1, 0.25, 0.5, 0.75, 1.0]}

  deblurring__dflow:
    enabled: true
    problem: deblur
    num_images: 4
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      sit:
        batch_size: 4
        methods:
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: [160, 320, 640],
                        lr: [0.003, 0.01, 0.03, 0.1, 0.3]}

  deblurring__mpc_rhc:
    enabled: true
    problem: deblur
    num_images: 4
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      sit:
        batch_size: 4
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, K: [1, 2, 3], n_ctrl: 40,
                        lam: [5.0, 15.0, 30.0, 60.0, 180.0, 240.0, 720.0], lr: [0.02, 0.05, 0.1, 0.2]}

  deblurring__mpc_delta_t:
    enabled: true
    problem: deblur
    num_images: 4
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      sit:
        batch_size: 4
        methods:
          mpc_delta_t: {t0: 1.0, num_mpc_steps: [4, 8], n_ctrl: [20, 40],
                        lam: [10.0, 30.0, 180.0, 360.0, 540.0, 1000.0], lr: [0.05, 0.1, 0.15, 0.3]}

  deblurring__rhso:
    enabled: true
    problem: deblur
    num_images: 4
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      sit:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 40, solver: heun,
                        lr: [0.005, 0.01, 0.02, 0.03, 0.05, 0.1], mu: [0.0, 0.2, 1.0]}

  deblurring__rhso_budget:
    enabled: true
    problem: deblur
    num_images: 4
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      sit:
        batch_size: 1
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: [2, 8], num_opt_steps: [20, 80], solver: heun,
                        lr: [0.01, 0.03], mu: 0.0}

  super_resolution__sdedit:
    enabled: true
    problem: super_resolution
    num_images: 4
    degradation: {sigma: 0.05, factor: 2}
    models:
      sit:
        batch_size: 4
        methods:
          sdedit:      {t0: 1.0, steps: [1, 2, 4, 8, 25], solver: heun}

  super_resolution__pnp:
    enabled: true
    problem: super_resolution
    num_images: 4
    degradation: {sigma: 0.05, factor: 2}
    models:
      sit:
        batch_size: 4
        methods:
          pnp:         {t0: 1.0, num_pnp_steps: [10, 20, 50, 100, 200],
                        gamma0: [25000.0, 100000.0, 200000.0, 400000.0, 800000.0, 1200000.0, 5000000.0],
                        alpha: [0.1, 0.25, 0.5, 0.75, 1.0]}

  super_resolution__dflow:
    enabled: true
    problem: super_resolution
    num_images: 4
    degradation: {sigma: 0.05, factor: 2}
    models:
      sit:
        batch_size: 4
        methods:
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: [160, 320, 640],
                        lr: [0.003, 0.01, 0.03, 0.1, 0.3]}

  super_resolution__mpc_rhc:
    enabled: true
    problem: super_resolution
    num_images: 4
    degradation: {sigma: 0.05, factor: 2}
    models:
      sit:
        batch_size: 4
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, K: [1, 2, 3], n_ctrl: 40,
                        lam: [5.0, 15.0, 30.0, 60.0, 180.0, 240.0, 720.0], lr: [0.02, 0.05, 0.1, 0.2]}

  super_resolution__mpc_delta_t:
    enabled: true
    problem: super_resolution
    num_images: 4
    degradation: {sigma: 0.05, factor: 2}
    models:
      sit:
        batch_size: 4
        methods:
          mpc_delta_t: {t0: 1.0, num_mpc_steps: [4, 8], n_ctrl: [20, 40],
                        lam: [10.0, 30.0, 180.0, 360.0, 540.0, 1000.0], lr: [0.05, 0.1, 0.15, 0.3]}

  super_resolution__rhso:
    enabled: true
    problem: super_resolution
    num_images: 4
    degradation: {sigma: 0.05, factor: 2}
    models:
      sit:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 40, solver: heun,
                        lr: [0.005, 0.01, 0.02, 0.03, 0.05, 0.1], mu: [0.0, 0.2, 1.0]}

  super_resolution__rhso_budget:
    enabled: true
    problem: super_resolution
    num_images: 4
    degradation: {sigma: 0.05, factor: 2}
    models:
      sit:
        batch_size: 1
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: [2, 8], num_opt_steps: [20, 80], solver: heun,
                        lr: [0.01, 0.03], mu: 0.0}

  random_inpainting__sdedit:
    enabled: true
    problem: random_inpaint
    num_images: 4
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      sit:
        batch_size: 4
        methods:
          sdedit:      {t0: 1.0, steps: [1, 2, 4, 8, 25], solver: heun}

  random_inpainting__pnp:
    enabled: true
    problem: random_inpaint
    num_images: 4
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      sit:
        batch_size: 4
        methods:
          pnp:         {t0: 1.0, num_pnp_steps: [10, 20, 50, 100, 200],
                        gamma0: [25000.0, 100000.0, 200000.0, 400000.0, 800000.0, 1200000.0, 5000000.0],
                        alpha: [0.1, 0.25, 0.5, 0.75, 1.0]}

  random_inpainting__dflow:
    enabled: true
    problem: random_inpaint
    num_images: 4
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      sit:
        batch_size: 4
        methods:
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: [160, 320, 640],
                        lr: [0.003, 0.01, 0.03, 0.1, 0.3]}

  random_inpainting__mpc_rhc:
    enabled: true
    problem: random_inpaint
    num_images: 4
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      sit:
        batch_size: 4
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, K: [1, 2, 3], n_ctrl: 40,
                        lam: [5.0, 15.0, 30.0, 60.0, 180.0, 240.0, 720.0], lr: [0.02, 0.05, 0.1, 0.2]}

  random_inpainting__mpc_delta_t:
    enabled: true
    problem: random_inpaint
    num_images: 4
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      sit:
        batch_size: 4
        methods:
          mpc_delta_t: {t0: 1.0, num_mpc_steps: [4, 8], n_ctrl: [20, 40],
                        lam: [10.0, 30.0, 180.0, 360.0, 540.0, 1000.0], lr: [0.05, 0.1, 0.15, 0.3]}

  random_inpainting__rhso:
    enabled: true
    problem: random_inpaint
    num_images: 4
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      sit:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 40, solver: heun,
                        lr: [0.005, 0.01, 0.02, 0.03, 0.05, 0.1], mu: [0.0, 0.2, 1.0]}

  random_inpainting__rhso_budget:
    enabled: true
    problem: random_inpaint
    num_images: 4
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      sit:
        batch_size: 1
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: [2, 8], num_opt_steps: [20, 80], solver: heun,
                        lr: [0.01, 0.03], mu: 0.0}

  box_inpainting__sdedit:
    enabled: true
    problem: box_inpaint
    num_images: 4
    degradation: {sigma: 0.05, box: 40}
    models:
      sit:
        batch_size: 4
        methods:
          sdedit:      {t0: 1.0, steps: [1, 2, 4, 8, 25], solver: heun}

  box_inpainting__pnp:
    enabled: true
    problem: box_inpaint
    num_images: 4
    degradation: {sigma: 0.05, box: 40}
    models:
      sit:
        batch_size: 4
        methods:
          pnp:         {t0: 1.0, num_pnp_steps: [10, 20, 50, 100, 200],
                        gamma0: [25000.0, 100000.0, 200000.0, 400000.0, 800000.0, 1200000.0, 5000000.0],
                        alpha: [0.1, 0.25, 0.5, 0.75, 1.0]}

  box_inpainting__dflow:
    enabled: true
    problem: box_inpaint
    num_images: 4
    degradation: {sigma: 0.05, box: 40}
    models:
      sit:
        batch_size: 4
        methods:
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: [160, 320, 640],
