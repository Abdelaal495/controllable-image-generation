# =====================================================================================
# Round 4 -- three open questions, plus a fairness repair
# =====================================================================================
#
# NOT the default configuration.  Run explicitly:
#   python run.py --config configs/experiments_round4.yaml --dry-run
#
# WHAT THIS ROUND IS FOR
#
# (1) lambda ran off the top of its grid on the PIXEL models -- again.
#     The four-model control arm (experiments_lambda_pixel_control.yaml) found a sharp
#     interior optimum for JiT at lambda = 5 with lambda = 500 clearly worse, so the
#     six-task pixel sweep used [1, 5, 15, 50].  Both MPC methods then pinned themselves to
#     the TOP of that grid.  The two results disagree because the control arm held n_ctrl
#     fixed while the six-task sweep varied it: the useful lambda depends on how many
#     optimiser iterations it has to work against.  So lambda and n_ctrl are crossed here
#     rather than swept one at a time.  Until this resolves, the claim "pixel models have a
#     sharp lambda optimum, latent models a plateau" is not safe to make.
#
# (2) K was under-explored.  MPC-Flow tabulates only K = 1 and K = 3, so those are all that
#     was tried, and on the pixel models K = 3 won 8 of 10 cells -- by 0.10 to 0.50 LPIPS,
#     which is far too large to leave at two grid points.  K = 2 is added, and deblurring
#     gets the K sweep it was accidentally missing.
#
# (3) mu has NEVER been swept on a pixel model.  RHSO wins 10 of 12 latent cells and only
#     3 of 12 pixel cells, and the obvious hypothesis was that RHSO lacks the control
#     penalty that helps in pixel space.  Checking the over-optimisation signature in the
#     existing data did NOT support that: of the nine pixel cells RHSO loses, only two show
#     it fitting the measurement better while scoring worse; in the other seven it is
#     simply worse on both.  But the check exposed something else -- mu, RHSO's own
#     penalty, was FIXED at 0 on the pixel sweeps because the latent sweeps found 0 best.
#     That is exactly the over-generalisation this project already got wrong once with
#     lambda.  mu is swept here on JiT and pMF.
#
# (4) FAIRNESS REPAIR.  The configurations-per-cell count was not equal across models:
#     RHSO got 66 configurations on SiT/denoising, 8 on the pixel models, and iMF's five
#     non-denoising tasks got 2 per method.  Within one cell that is still a fair fight --
#     every method was starved equally -- but it makes the CROSS-MODEL statement
#     ("RHSO wins more often on latent models") partly a statement about tuning budget.
#     iMF's MPC methods get the same lambda grid SiT received on those five tasks, so if
#     RHSO still wins there it is not because its rivals were starved.
#
# t0 = 0.8 and beta = 1.0 throughout, matching every earlier sweep.
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: true
  verbose: true
  max_atomic_jobs: 500
  resume: true
  replicate: 0
  gpu_memory_profiling: true

data:
  # Executed with data.source: local_folder on a machine without an HF token; committed as
  # hf_imagenet_val so the file works anywhere.
  source: hf_imagenet_val
  local_folder: ""
  image_size: 256

models:
  jit:
    variant: JiT-B/16
    batch_size: 2
  pmf:
    batch_size: 2
  imf:
    batch_size: 2
    vae_decode_batch: 2

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: true

metrics:
  lpips: true
  lpips_net: alex

experiments:

  denoising:
    enabled: true
    problem: denoising
    num_images: 8
    degradation: {sigma: 0.20}
    models:
      jit:
        methods:
          # (1) lambda crossed with n_ctrl; (2) K = 2 added
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: [1, 2, 3], n_ctrl: 20,
                        lam: [15.0, 50.0, 150.0, 500.0]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4, n_ctrl: [40, 80],
                        lam: [30.0, 100.0, 300.0, 1000.0]}
          # (3) mu on a pixel model for the first time
          rhso:        {t0: 0.8, num_rhso_steps: 4, solver: heun, beta: 0.5,
                        num_opt_steps: 40, lr: [0.05, 0.1], mu: [0.0, 0.05, 0.2]}
      pmf:
        methods:
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: [1, 2, 3], n_ctrl: 20,
                        lam: [15.0, 50.0, 150.0, 500.0]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2, n_ctrl: [40, 80],
                        lam: [30.0, 100.0, 300.0, 1000.0]}
          rhso:        {t0: 0.8, num_rhso_steps: 4, beta: 0.5,
                        num_opt_steps: 20, lr: [0.05, 0.1], mu: [0.0, 0.05, 0.2]}

  deblurring:
    enabled: true
    problem: deblur
    num_images: 8
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      jit:
        methods:
          # (1) lambda crossed with n_ctrl; (2) K = 2 added
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: [1, 2, 3], n_ctrl: 20,
                        lam: [15.0, 50.0, 150.0, 500.0]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4, n_ctrl: [40, 80],
                        lam: [30.0, 100.0, 300.0, 1000.0]}
          # (3) mu on a pixel model for the first time
          rhso:        {t0: 0.8, num_rhso_steps: 4, solver: heun, beta: 0.5,
                        num_opt_steps: 40, lr: [0.05, 0.1], mu: [0.0, 0.05, 0.2]}
      pmf:
        methods:
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: [1, 2, 3], n_ctrl: 20,
                        lam: [15.0, 50.0, 150.0, 500.0]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2, n_ctrl: [40, 80],
                        lam: [30.0, 100.0, 300.0, 1000.0]}
          rhso:        {t0: 0.8, num_rhso_steps: 4, beta: 0.5,
                        num_opt_steps: 20, lr: [0.05, 0.1], mu: [0.0, 0.05, 0.2]}
      imf:
        methods:
          # (4) the same lambda grid SiT got on these five tasks, so RHSO's rivals
          # are not starved when the cross-model claim is made
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: 1, n_ctrl: 20,
                        lam: [5.0, 15.0, 50.0]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2, n_ctrl: 20,
                        lam: [15.0, 30.0, 300.0]}

  super_resolution:
    enabled: true
    problem: super_resolution
    num_images: 8
    degradation: {sigma: 0.05, factor: 2}
    models:
      jit:
        methods:
          # (1) lambda crossed with n_ctrl; (2) K = 2 added
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: [1, 2, 3], n_ctrl: 20,
                        lam: [15.0, 50.0, 150.0, 500.0]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4, n_ctrl: [40, 80],
                        lam: [30.0, 100.0, 300.0, 1000.0]}
          # (3) mu on a pixel model for the first time
          rhso:        {t0: 0.8, num_rhso_steps: 4, solver: heun, beta: 0.5,
                        num_opt_steps: 40, lr: [0.05, 0.1], mu: [0.0, 0.05, 0.2]}
      pmf:
        methods:
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: [1, 2, 3], n_ctrl: 20,
                        lam: [15.0, 50.0, 150.0, 500.0]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2, n_ctrl: [40, 80],
                        lam: [30.0, 100.0, 300.0, 1000.0]}
          rhso:        {t0: 0.8, num_rhso_steps: 4, beta: 0.5,
                        num_opt_steps: 20, lr: [0.05, 0.1], mu: [0.0, 0.05, 0.2]}
      imf:
        methods:
          # (4) the same lambda grid SiT got on these five tasks, so RHSO's rivals
          # are not starved when the cross-model claim is made
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: 1, n_ctrl: 20,
                        lam: [5.0, 15.0, 50.0]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2, n_ctrl: 20,
                        lam: [15.0, 30.0, 300.0]}

  box_inpainting:
    enabled: true
    problem: box_inpaint
    num_images: 8
    degradation: {sigma: 0.05, box: 40}
    models:
      jit:
        methods:
          # (1) lambda crossed with n_ctrl; (2) K = 2 added
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: [1, 2, 3], n_ctrl: 20,
                        lam: [15.0, 50.0, 150.0, 500.0]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4, n_ctrl: [40, 80],
                        lam: [30.0, 100.0, 300.0, 1000.0]}
          # (3) mu on a pixel model for the first time
          rhso:        {t0: 0.8, num_rhso_steps: 4, solver: heun, beta: 0.5,
                        num_opt_steps: 40, lr: [0.05, 0.1], mu: [0.0, 0.05, 0.2]}
      pmf:
        methods:
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: [1, 2, 3], n_ctrl: 20,
                        lam: [15.0, 50.0, 150.0, 500.0]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2, n_ctrl: [40, 80],
                        lam: [30.0, 100.0, 300.0, 1000.0]}
          rhso:        {t0: 0.8, num_rhso_steps: 4, beta: 0.5,
                        num_opt_steps: 20, lr: [0.05, 0.1], mu: [0.0, 0.05, 0.2]}
      imf:
        methods:
          # (4) the same lambda grid SiT got on these five tasks, so RHSO's rivals
          # are not starved when the cross-model claim is made
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: 1, n_ctrl: 20,
                        lam: [5.0, 15.0, 50.0]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2, n_ctrl: 20,
                        lam: [15.0, 30.0, 300.0]}

  random_inpainting:
    enabled: true
    problem: random_inpaint
    num_images: 8
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      jit:
        methods:
          # (1) lambda crossed with n_ctrl; (2) K = 2 added
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: [1, 2, 3], n_ctrl: 20,
                        lam: [15.0, 50.0, 150.0, 500.0]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4, n_ctrl: [40, 80],
                        lam: [30.0, 100.0, 300.0, 1000.0]}
          # (3) mu on a pixel model for the first time
          rhso:        {t0: 0.8, num_rhso_steps: 4, solver: heun, beta: 0.5,
                        num_opt_steps: 40, lr: [0.05, 0.1], mu: [0.0, 0.05, 0.2]}
      pmf:
        methods:
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: [1, 2, 3], n_ctrl: 20,
                        lam: [15.0, 50.0, 150.0, 500.0]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2, n_ctrl: [40, 80],
                        lam: [30.0, 100.0, 300.0, 1000.0]}
          rhso:        {t0: 0.8, num_rhso_steps: 4, beta: 0.5,
                        num_opt_steps: 20, lr: [0.05, 0.1], mu: [0.0, 0.05, 0.2]}
      imf:
        methods:
          # (4) the same lambda grid SiT got on these five tasks, so RHSO's rivals
          # are not starved when the cross-model claim is made
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: 1, n_ctrl: 20,
                        lam: [5.0, 15.0, 50.0]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2, n_ctrl: 20,
                        lam: [15.0, 30.0, 300.0]}

  stroke_painting:
    enabled: true
    problem: stroke_painting
    num_images: 8
    degradation: {preset: medium, sigma: 0.0, blur_sigma: 0.8}
    models:
      jit:
        methods:
          # (1) lambda crossed with n_ctrl; (2) K = 2 added
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 4, K: [1, 2, 3], n_ctrl: 20,
                        lam: [15.0, 50.0, 150.0, 500.0]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 4, n_ctrl: [40, 80],
                        lam: [30.0, 100.0, 300.0, 1000.0]}
          # (3) mu on a pixel model for the first time
          rhso:        {t0: 0.8, num_rhso_steps: 4, solver: heun, beta: 0.5,
                        num_opt_steps: 40, lr: [0.05, 0.1], mu: [0.0, 0.05, 0.2]}
      pmf:
        methods:
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: [1, 2, 3], n_ctrl: 20,
                        lam: [15.0, 50.0, 150.0, 500.0]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2, n_ctrl: [40, 80],
                        lam: [30.0, 100.0, 300.0, 1000.0]}
          rhso:        {t0: 0.8, num_rhso_steps: 4, beta: 0.5,
                        num_opt_steps: 20, lr: [0.05, 0.1], mu: [0.0, 0.05, 0.2]}
      imf:
        methods:
          # (4) the same lambda grid SiT got on these five tasks, so RHSO's rivals
          # are not starved when the cross-model claim is made
          mpc_rhc:     {t0: 0.8, num_mpc_steps: 2, K: 1, n_ctrl: 20,
                        lam: [5.0, 15.0, 50.0]}
          mpc_delta_t: {t0: 0.8, num_mpc_steps: 2, n_ctrl: 20,
                        lam: [15.0, 30.0, 300.0]}
