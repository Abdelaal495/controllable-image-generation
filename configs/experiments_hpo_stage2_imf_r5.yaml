# Stage-2 follow-up round for imf (generated by scripts/hpo_stage2_round.py from outputs/stage2_imf, outputs/stage2_imf_r2, outputs/stage2_imf_r3, outputs/stage2_imf_r4):
# one step further out on every axis where the 8-image winner still sat on the edge of everything tried.
runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: true
  verbose: true
  max_atomic_jobs: 4000
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02

data:
  source: local_folder
  local_folder: "cache/data/imagenet_val_100"
  image_size: 256

models:
  imf: {}

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false

metrics:
  lpips: true
  lpips_net: alex

# Round 5 pruned to super_resolution PnP: it is the only axis whose last doubling was still significant
# (paired t on 8 images, 1893 -> 4004: p=0.008, 8/8 images better).  Every other push was p > 0.06.
experiments:
  super_resolution__pnp__x1:
    enabled: true
    problem: super_resolution
    num_images: 8
    degradation: {sigma: 0.05, factor: 2}
    models:
      imf:
        batch_size: 2
        methods:
          pnp: {t0: 1.0, num_pnp_steps: 8468, gamma0: 100000.0, alpha: 1}   # edge:num_pnp_steps+

