# =====================================================================================
# Focused follow-up sweep: prioritize MPC lambda, PnP gamma0, and D-Flow optimization budget
# =====================================================================================
#
# Purpose
# -------
# This is the second-round tuning sweep after the broad t0=1 study.
# It keeps t0 fixed at 1.0 for all methods and focuses primarily on:
#
#   1) MPC-RHC / MPC-delta_t : lambda        (5 values)
#   2) PnP-Flow             : gamma0         (5 values)
#   3) D-Flow               : num_opt_steps  (5 values)
#
# Other hyperparameters are still tuned, but more narrowly around the promising regimes
# observed in the first sweep.
#
# Main design choices carried over from the first analysis:
# - JiT favors MPC-RHC, with K around 1-3 and n_ctrl around 20.
# - pMF favors MPC-delta_t, with relatively small delta (num_mpc_steps around 2-4),
#   and RHC horizons around K=1-2.
# - PnP needed larger gamma0 than the initial coarse sweep and useful N differed by model:
#     JiT -> larger N remains useful
#     pMF -> N too large can collapse performance
# - D-Flow improved at the boundary of the previous num_opt_steps sweep, so we push farther.
#
# Expected atomic jobs
# --------------------
# Per task / JiT:
#   SDEdit        : 1
#   MPC-RHC       : 2 K x 2 n_ctrl x 5 lambda                 = 20
#   MPC-delta_t   : 2 num_mpc_steps x 5 lambda                = 10
#   PnP-Flow      : 3 N x 5 gamma0                            = 15
#   D-Flow        : 3 steps x 2 lr x 5 num_opt_steps          = 30
#                                                             ----
#                                                              76
#
# Per task / pMF:
#   SDEdit        : 1
#   MPC-RHC       : 2 K x 2 n_ctrl x 5 lambda                 = 20
#   MPC-delta_t   : 2 num_mpc_steps x 5 lambda                = 10
#   PnP-Flow      : 3 N x 5 gamma0                            = 15
#   D-Flow        : 3 steps x 2 lr x 5 num_opt_steps          = 30
#                                                             ----
#                                                              76
#
# Six tasks x 2 models x 76 = 912 atomic jobs.
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: auto
  continue_on_experiment_error: true
  progress_bars: true
  save_individual_images: true
  verbose: true
  max_atomic_jobs: 1200
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02

data:
  source: hf_imagenet_val
  local_folder: ""
  image_size: 256

models:
  jit:
    variant: JiT-B/16
    batch_size: 2
  pmf:
    batch_size: 2

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: true

metrics:
  lpips: true
  lpips_net: alex

# Lambda values are shared across MPC methods.
# The first sweep strongly preferred lambda=15 over {0.5,5,15}, so this sweep explores
# a broader and higher range while still retaining 5.
#
# PnP gamma0 values are also shared in spirit but adapted slightly by model:
# - JiT is swept a bit higher because larger N remained stable/useful.
# - pMF is kept somewhat lower because its useful N range was smaller and high-N collapse
#   suggests a narrower stability margin.
#
# D-Flow sweeps 5 optimization budgets and 2 learning rates. The goal is to determine
# whether the previous "20 opt steps is best" result was simply a boundary effect.

experiments:

  # ------------------------------------------------------------------- 1. denoising
  denoising:
    enabled: true
    problem: denoising
    num_images: 2
    degradation:
      sigma: 0.20
    models:
      jit:
        methods:
          sdedit:
            t0: 1.0
            steps: 25
            solver: heun
          mpc_rhc:
            t0: 1.0
            num_mpc_steps: 4
            K: [1, 3]
            n_ctrl: [20, 50]
            lam: [5.0, 15.0, 30.0, 60.0, 120.0]
          mpc_delta_t:
            t0: 1.0
            num_mpc_steps: [2, 4]        # delta = [0.5, 0.25]
            lam: [5.0, 15.0, 30.0, 60.0, 120.0]
          pnp:
            t0: 1.0
            num_pnp_steps: [50, 100, 200]
            gamma0: [50000.0, 100000.0, 200000.0, 400000.0, 800000.0]
            alpha: 1.0
            noise_samples: 1
          dflow:
            t0: 1.0
            steps: [1, 2, 4]
            solver: heun
            num_opt_steps: [10, 20, 40, 80, 160]
            lr: [0.003, 0.01]
            optimizer: adam

      pmf:
        methods:
          sdedit:
            t0: 1.0
            steps: 1
          mpc_rhc:
            t0: 1.0
            num_mpc_steps: 2
            K: [1, 2]
            n_ctrl: [15, 30]
            lam: [5.0, 15.0, 30.0, 60.0, 120.0]
          mpc_delta_t:
            t0: 1.0
            num_mpc_steps: [2, 4]        # delta = [0.5, 0.25]
            lam: [5.0, 15.0, 30.0, 60.0, 120.0]
          pnp:
            t0: 1.0
            num_pnp_steps: [20, 50, 80]
            gamma0: [20000.0, 50000.0, 100000.0, 200000.0, 400000.0]
            alpha: 1.0
            noise_samples: 1
          dflow:
            t0: 1.0
            steps: [1, 2, 4]
            num_opt_steps: [10, 20, 40, 80, 160]
            lr: [0.003, 0.01]
            optimizer: adam

  # ------------------------------------------------------------------- 2. deblurring
  deblurring:
    enabled: true
    problem: deblur
    num_images: 2
    degradation:
      sigma: 0.05
      blur_sigma: 1.0
      kernel_size: 7
      padding: reflect
    models:
      jit:
        methods:
          sdedit:      {t0: 1.0, steps: 25, solver: heun}
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, K: [1, 3], n_ctrl: [20, 50], lam: [5.0, 15.0, 30.0, 60.0, 120.0]}
          mpc_delta_t: {t0: 1.0, num_mpc_steps: [2, 4], lam: [5.0, 15.0, 30.0, 60.0, 120.0]}
          pnp:         {t0: 1.0, num_pnp_steps: [50, 100, 200], gamma0: [50000.0, 100000.0, 200000.0, 400000.0, 800000.0], alpha: 1.0, noise_samples: 1}
          dflow:       {t0: 1.0, steps: [1, 2, 4], solver: heun, num_opt_steps: [10, 20, 40, 80, 160], lr: [0.003, 0.01], optimizer: adam}
      pmf:
        methods:
          sdedit:      {t0: 1.0, steps: 1}
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 2, K: [1, 2], n_ctrl: [15, 30], lam: [5.0, 15.0, 30.0, 60.0, 120.0]}
          mpc_delta_t: {t0: 1.0, num_mpc_steps: [2, 4], lam: [5.0, 15.0, 30.0, 60.0, 120.0]}
          pnp:         {t0: 1.0, num_pnp_steps: [20, 50, 80], gamma0: [20000.0, 50000.0, 100000.0, 200000.0, 400000.0], alpha: 1.0, noise_samples: 1}
          dflow:       {t0: 1.0, steps: [1, 2, 4], num_opt_steps: [10, 20, 40, 80, 160], lr: [0.003, 0.01], optimizer: adam}

  # ------------------------------------------------------------------- 3. super-resolution
  super_resolution:
    enabled: true
    problem: super_resolution
    num_images: 2
    degradation:
      sigma: 0.05
      factor: 2
    models:
      jit:
        methods:
          sdedit:      {t0: 1.0, steps: 25, solver: heun}
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, K: [1, 3], n_ctrl: [20, 50], lam: [5.0, 15.0, 30.0, 60.0, 120.0]}
          mpc_delta_t: {t0: 1.0, num_mpc_steps: [2, 4], lam: [5.0, 15.0, 30.0, 60.0, 120.0]}
          pnp:         {t0: 1.0, num_pnp_steps: [50, 100, 200], gamma0: [50000.0, 100000.0, 200000.0, 400000.0, 800000.0], alpha: 1.0, noise_samples: 1}
          dflow:       {t0: 1.0, steps: [1, 2, 4], solver: heun, num_opt_steps: [10, 20, 40, 80, 160], lr: [0.003, 0.01], optimizer: adam}
      pmf:
        methods:
          sdedit:      {t0: 1.0, steps: 1}
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 2, K: [1, 2], n_ctrl: [15, 30], lam: [5.0, 15.0, 30.0, 60.0, 120.0]}
          mpc_delta_t: {t0: 1.0, num_mpc_steps: [2, 4], lam: [5.0, 15.0, 30.0, 60.0, 120.0]}
          pnp:         {t0: 1.0, num_pnp_steps: [20, 50, 80], gamma0: [20000.0, 50000.0, 100000.0, 200000.0, 400000.0], alpha: 1.0, noise_samples: 1}
          dflow:       {t0: 1.0, steps: [1, 2, 4], num_opt_steps: [10, 20, 40, 80, 160], lr: [0.003, 0.01], optimizer: adam}

  # ------------------------------------------------------------------- 4. box inpainting
  box_inpainting:
    enabled: true
    problem: box_inpaint
    num_images: 2
    degradation:
      sigma: 0.05
      box: 40
    models:
      jit:
        methods:
          sdedit:      {t0: 1.0, steps: 25, solver: heun}
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, K: [1, 3], n_ctrl: [20, 50], lam: [5.0, 15.0, 30.0, 60.0, 120.0]}
          mpc_delta_t: {t0: 1.0, num_mpc_steps: [2, 4], lam: [5.0, 15.0, 30.0, 60.0, 120.0]}
          pnp:         {t0: 1.0, num_pnp_steps: [50, 100, 200], gamma0: [50000.0, 100000.0, 200000.0, 400000.0, 800000.0], alpha: 1.0, noise_samples: 1}
          dflow:       {t0: 1.0, steps: [1, 2, 4], solver: heun, num_opt_steps: [10, 20, 40, 80, 160], lr: [0.003, 0.01], optimizer: adam}
      pmf:
        methods:
          sdedit:      {t0: 1.0, steps: 1}
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 2, K: [1, 2], n_ctrl: [15, 30], lam: [5.0, 15.0, 30.0, 60.0, 120.0]}
          mpc_delta_t: {t0: 1.0, num_mpc_steps: [2, 4], lam: [5.0, 15.0, 30.0, 60.0, 120.0]}
          pnp:         {t0: 1.0, num_pnp_steps: [20, 50, 80], gamma0: [20000.0, 50000.0, 100000.0, 200000.0, 400000.0], alpha: 1.0, noise_samples: 1}
          dflow:       {t0: 1.0, steps: [1, 2, 4], num_opt_steps: [10, 20, 40, 80, 160], lr: [0.003, 0.01], optimizer: adam}

  # ------------------------------------------------------------------- 5. random inpainting
  random_inpainting:
    enabled: true
    problem: random_inpaint
    num_images: 2
    degradation:
      sigma: 0.01
      missing_fraction: 0.70
    models:
      jit:
        methods:
          sdedit:      {t0: 1.0, steps: 25, solver: heun}
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, K: [1, 3], n_ctrl: [20, 50], lam: [5.0, 15.0, 30.0, 60.0, 120.0]}
          mpc_delta_t: {t0: 1.0, num_mpc_steps: [2, 4], lam: [5.0, 15.0, 30.0, 60.0, 120.0]}
          pnp:         {t0: 1.0, num_pnp_steps: [50, 100, 200], gamma0: [50000.0, 100000.0, 200000.0, 400000.0, 800000.0], alpha: 1.0, noise_samples: 1}
          dflow:       {t0: 1.0, steps: [1, 2, 4], solver: heun, num_opt_steps: [10, 20, 40, 80, 160], lr: [0.003, 0.01], optimizer: adam}
      pmf:
        methods:
          sdedit:      {t0: 1.0, steps: 1}
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 2, K: [1, 2], n_ctrl: [15, 30], lam: [5.0, 15.0, 30.0, 60.0, 120.0]}
          mpc_delta_t: {t0: 1.0, num_mpc_steps: [2, 4], lam: [5.0, 15.0, 30.0, 60.0, 120.0]}
          pnp:         {t0: 1.0, num_pnp_steps: [20, 50, 80], gamma0: [20000.0, 50000.0, 100000.0, 200000.0, 400000.0], alpha: 1.0, noise_samples: 1}
          dflow:       {t0: 1.0, steps: [1, 2, 4], num_opt_steps: [10, 20, 40, 80, 160], lr: [0.003, 0.01], optimizer: adam}

  # ------------------------------------------------------------------- 6. stroke painting
  stroke_painting:
    enabled: true
    problem: stroke_painting
    num_images: 2
    degradation:
      preset: medium
      sigma: 0.0
      blur_sigma: 0.8
    models:
      jit:
        methods:
          sdedit:      {t0: 1.0, steps: 25, solver: heun}
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, K: [1, 3], n_ctrl: [20, 50], lam: [5.0, 15.0, 30.0, 60.0, 120.0]}
          mpc_delta_t: {t0: 1.0, num_mpc_steps: [2, 4], lam: [5.0, 15.0, 30.0, 60.0, 120.0]}
          pnp:         {t0: 1.0, num_pnp_steps: [50, 100, 200], gamma0: [50000.0, 100000.0, 200000.0, 400000.0, 800000.0], alpha: 1.0, noise_samples: 1}
          dflow:       {t0: 1.0, steps: [1, 2, 4], solver: heun, num_opt_steps: [10, 20, 40, 80, 160], lr: [0.003, 0.01], optimizer: adam}
      pmf:
        methods:
          sdedit:      {t0: 1.0, steps: 1}
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 2, K: [1, 2], n_ctrl: [15, 30], lam: [5.0, 15.0, 30.0, 60.0, 120.0]}
          mpc_delta_t: {t0: 1.0, num_mpc_steps: [2, 4], lam: [5.0, 15.0, 30.0, 60.0, 120.0]}
          pnp:         {t0: 1.0, num_pnp_steps: [20, 50, 80], gamma0: [20000.0, 50000.0, 100000.0, 200000.0, 400000.0], alpha: 1.0, noise_samples: 1}
          dflow:       {t0: 1.0, steps: [1, 2, 4], num_opt_steps: [10, 20, 40, 80, 160], lr: [0.003, 0.01], optimizer: adam}
